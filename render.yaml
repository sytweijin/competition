services:
  - type: web
    name: collaboration-planner-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ADMIN_TOKEN
        generateValue: true
      - key: APP_HTTPS
        value: "0"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: DeepSeek-V3.2
      - key: APP_VISION_MODEL
        value: qwen3.7-plus
      - key: APP_ASR_MODEL
        value: qwen-audio-3.0-asr-flash
      - key: APP_VISION_API_KEY
        sync: false
      - key: APP_VISION_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: APP_ASR_API_KEY
        sync: false
      - key: APP_ASR_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: APP_ASR_TRANSCRIPTION_MODE
        value: auto
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_PREFIX
        value: workbench/
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
