services:
  - type: web
    name: collaboration-planner-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ADMIN_TOKEN
        generateValue: true
      - key: APP_HTTPS
        value: "0"
      # 创新应用赛道合规模式：仅使用 MiniCPM-o 4.5，禁用一切外部模型兜底。
      # 与 .env.example 参赛交付模板保持一致，不再配置 DeepSeek/DashScope。
      - key: APP_MODEL_MODE
        value: minicpm
      - key: APP_ALLOW_EXTERNAL_MODELS
        value: "0"
      - key: MAP_REALTIME_API_KEY
        sync: false
      - key: MAP_REALTIME_MODEL
        value: MiniCPM-o-4.5-Realtime
      - key: MAP_REALTIME_BASE_URL
        value: wss://api.modelbest.cn/v1/realtime
      - key: MAP_REALTIME_MAX_TOKENS
        value: "1024"
      - key: MAP_REALTIME_TIMEOUT
        value: "60"
      # 本地昇腾 A3：Render 等公网环境通常不可达，保持留空即可走云端 API；
      # 自托管评审环境可填入 ws://<A3地址>:28099/backend
      - key: ASCEND_OMNI_WS_URL
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: S3_BUCKET
        sync: false
      - key: S3_PREFIX
        value: workbench/
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
