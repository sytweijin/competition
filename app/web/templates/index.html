<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>协作分工智能体 · 项目工作台</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>.hidden{display:none!important}</style>
  <link rel="stylesheet" href="/static/style.css?v=5.76.2">
</head>
<body>
<header class="app-header">
  <div class="header-brand">
    <div class="brand-mark"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="4.5" y="4.5" width="23" height="23" rx="7" stroke="currentColor" stroke-width="1.5" opacity=".32"/><circle cx="11.5" cy="12" r="2.5" fill="currentColor"/><circle cx="20.5" cy="11" r="2.5" fill="currentColor" opacity=".85"/><circle cx="16" cy="20.5" r="2.5" fill="currentColor" opacity=".62"/><path d="M13 13.6 15.2 18M19.4 13l-2 5M13.8 12h4.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".5"/></svg></div>
    <div><h1>协作分工智能体</h1></div>
  </div>
  <div class="header-tools">
    <button id="historyBtn" class="btn btn-ghost">版本树</button>
    <button id="saveBtn" class="btn btn-ghost" disabled>保存方案</button>
    <button id="exportMdBtn" class="btn btn-ghost" disabled>导出MD</button>
    <button id="exportDocxBtn" class="btn btn-ghost" disabled>导出Word</button>
    <button id="exportPdfBtn" class="btn btn-ghost" disabled>导出PDF</button>
    <button id="exportExcelBtn" class="btn btn-ghost" disabled>导出Excel</button>
    <button id="exportCsvBtn" class="btn btn-ghost" disabled>导出CSV</button>
    <button id="exportIcsBtn" class="btn btn-ghost" disabled>导出ICS</button>
    <button id="shareBtn" class="btn btn-ghost" disabled>复制只读链接</button>
    <button id="reportLinkBtn" class="btn btn-ghost" title="生成成员轻量汇报链接（语音/拍照更新任务）">成员汇报链接</button>
  </div>
</header>
<nav class="step-nav" id="stepNav"></nav>
<main class="app-main">
  <div id="notice" class="notice hidden"></div>
  <section id="configView" class="view config-view">
    <div class="config-card">
    <div class="config-head">
      <div><h2>项目配置</h2></div>
        <div class="config-actions"><button type="button" id="demoCaseBtn" class="btn btn-ghost">载入演示案例</button><button type="button" id="meetingBtn" class="btn btn-ghost" title="上传会议录音/录像，AI 边看边听整理任务">🎙 会议旁听</button><button type="button" id="importFileBtn" class="btn btn-ghost">导入任务文件</button><input id="importFile" type="file" hidden accept=".csv,.xlsx,.xlsm"><input id="meetingFile" type="file" hidden accept=".mp3,.wav,.m4a,.webm,.mp4,.mov,.m4v,.mkv"></div>
      </div>
      <form id="projectForm" class="config-form">
        <div class="mode-selector">
          <label class="mode-card active" data-mode="small_group">
            <input type="radio" name="projectMode" value="small_group" checked>
            <div class="mode-card-body"><span class="mode-card-icon"><svg viewBox="0 0 20 20" fill="none"><circle cx="7" cy="6" r="2.4" fill="currentColor"/><circle cx="13" cy="6" r="2.4" fill="currentColor" opacity=".7"/><circle cx="7" cy="14" r="2.4" fill="currentColor" opacity=".7"/><circle cx="13" cy="14" r="2.4" fill="currentColor" opacity=".5"/><path d="M7 8.4v3.2M13 8.4v3.2M9.4 6h1.2M9.4 14h1.2M7 9.6h6" stroke="currentColor" stroke-width="1" opacity=".25"/></svg></span><div><strong>小型项目</strong><span>人员固定，先看人再拆任务</span></div></div>
          </label>
          <label class="mode-card" data-mode="large_project">
            <input type="radio" name="projectMode" value="large_project">
            <div class="mode-card-body"><span class="mode-card-icon"><svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="6.5" height="6.5" rx="2" fill="currentColor"/><rect x="11.5" y="2" width="6.5" height="6.5" rx="2" fill="currentColor" opacity=".6"/><rect x="2" y="11.5" width="6.5" height="6.5" rx="2" fill="currentColor" opacity=".6"/><rect x="11.5" y="11.5" width="6.5" height="6.5" rx="2" fill="currentColor" opacity=".35"/></svg></span><div><strong>大型项目</strong><span>先拆大任务再认领招募</span></div></div>
          </label>
        </div>
        <div class="config-grid">
          <label class="config-field span-2">项目名称<input id="projectName" required placeholder="如：校园低碳生活倡议发布"></label>
          <label class="config-field span-2">项目背景<textarea id="background" required rows="4" placeholder="说明项目目标、过程和最终交付物"></textarea></label>
          <label class="config-field span-2">补充要求<textarea id="requirements" rows="2" placeholder="格式、评价标准、特殊限制等"></textarea></label>
          <label class="config-field">默认开始日期<input id="startDate" type="date"></label>
          <label class="config-field">默认截止日期<input id="endDate" type="date" required></label>
          <div class="config-field span-2 member-section">
            <div class="member-section-head">
              <span id="memberSectionTitle">团队成员</span>
              <button type="button" id="addMemberBtn" class="text-btn">＋ 添加成员</button>
            </div>
            <p id="memberSectionHint" class="member-section-hint hidden"></p>
            <div id="members" class="member-list"></div>
          </div>
          <div class="config-field span-2 upload-box" id="uploadBox">
            <input id="files" type="file" multiple hidden accept=".pdf,.docx,.txt,.md,.xlsx,.pptx,.png,.jpg,.jpeg,.webp,.mp3,.wav,.m4a">
            <button type="button" id="chooseFileBtn" class="btn btn-ghost">上传任务要求文件</button>
            <button type="button" id="cameraReqBtn" class="btn btn-ghost" title="拍摄或选择需求照片、白板、群聊截图">📷 拍照需求</button>
            <button type="button" id="voiceReqBtn" class="btn btn-ghost" title="录音描述项目需求和目标，自动加入需求材料">🎤 添加语音需求</button>
            <input id="cameraReqFile" type="file" hidden accept="image/*" capture="environment">
            <div id="fileList" class="file-list"></div>
          </div>
        </div>
        <div class="generation-actions">
          <button id="generateBtn" class="btn btn-primary btn-lg" type="submit">
            <span>AI 生成任务拆解</span>
          </button>
          <button id="quickGenerateBtn" class="btn btn-ghost btn-lg" type="button">
            <span>快速生成</span>
          </button>
        </div>
      </form>
    </div>
  </section>
  <section id="draftView" class="view hidden">
    <div id="draftToolbar" class="toolbar-bar"></div>
    <div id="draftSummary" class="summary-card"></div>
    <div id="taskEditor" class="task-editor"></div>
    <div class="sticky-action">
      <div><strong id="draftTotal"></strong><span id="draftHint"></span></div>
      <div id="draftStageActions" class="stage-actions hidden"></div>
      <button id="confirmDraftBtn" class="btn btn-primary">确认拆解并开始分工</button>
    </div>
  </section>
  <section id="boardView" class="view hidden">
    <div id="boardToolbar" class="toolbar-bar"></div>
    <div id="largeBoardTabs" class="large-board-tabs hidden"></div>
    <div id="workloadSummary" class="workload-summary"></div>
    <div id="balanceWarnings"></div>
    <div id="board" class="assignment-board"></div>
    <div class="sticky-action">
      <div><strong>调整完成后确认最终方案</strong><span>建议不会阻止你保存</span></div>
      <button id="confirmAssignmentBtn" class="btn btn-primary">确认最终分工</button>
    </div>
  </section>
  <section id="finalView" class="view hidden">
    <div class="audience-switcher" aria-label="选择查看角色">
      <div><strong>按角色查看</strong><span>同一方案，不同关注重点</span></div>
      <div class="audience-controls">
        <div class="audience-role-buttons">
          <button type="button" class="active" data-audience-role="manager">负责人</button>
          <button type="button" data-audience-role="member">成员</button>
          <button type="button" data-audience-role="reviewer">教师 / 评委</button>
        </div>
        <select id="audienceMemberPicker" class="hidden" aria-label="选择成员"></select>
      </div>
    </div>
    <section id="audienceSummary" class="audience-summary" aria-live="polite"></section>
    <div class="result-tabs" id="resultTabs">
      <button class="active" data-tab="tasks">任务计划</button>
      <button data-tab="schedule">排期资源</button>
      <button data-tab="team">团队负载</button>
      <button data-tab="collaboration" id="memberTabBtn">分工协作</button>
      <button data-tab="review">执行复盘</button>
      <button data-tab="report">项目报告</button>
      <button data-tab="interview" id="defenseTabBtn">答辩模拟</button>
    </div>
    <div id="resultContent" class="result-content"></div>
    <div class="sticky-action">
      <span>导出 / 分享功能已移至顶部工具栏</span>
      <button id="backBoardBtn" class="btn btn-ghost">返回调整</button>
    </div>
  </section>
</main>
<section id="reportView" class="view report-view hidden">
  <div id="reportNotice" class="notice hidden"></div>
  <div class="report-head">
    <div><h2 id="reportProject">项目汇报</h2><p id="reportMember">成员</p></div>
    <div id="reportDeadline" class="report-deadline"></div>
  </div>
  <div id="reportTasks" class="report-tasks"></div>
  <input id="reportPhotoInput" type="file" hidden accept="image/*" capture="environment">
</section>
<button id="assistantBtn" class="assistant-button" type="button" aria-label="打开 AI 调整建议" aria-expanded="false"><span class="assistant-button-icon" aria-hidden="true">✦</span><span class="assistant-button-label">AI 建议</span></button>
<aside id="assistantDrawer" class="assistant-drawer hidden" role="dialog" aria-label="AI 调整建议">
  <div class="drawer-head"><div class="drawer-title"><span class="drawer-title-icon" aria-hidden="true">✦</span><div><strong>AI 调整建议</strong><p>分析当前方案，不会自动修改数据</p></div></div><div class="drawer-actions"><label class="voice-toggle" title="开启后使用 MiniCPM-o 语音回复"><input type="checkbox" id="voiceToggle" disabled><span>语音回复</span></label><button id="closeAssistant" type="button" aria-label="关闭 AI 调整建议">×</button></div></div>
  <div id="realtimeBadge" class="drawer-badge hidden"></div>
  <div id="messages" class="messages"><div class="assistant-msg">你好，我可以分析任务拆解、工时和分工，并给出调整建议。</div></div>
  <form id="chatForm" class="chat-form"><textarea id="chatInput" rows="2" placeholder="例如：摄影任务是不是太集中？"></textarea><button type="button" id="micBtn" class="mic-btn" aria-label="语音输入" title="语音输入">🎤</button><button type="submit" id="chatSendBtn">发送</button></form>
</aside>
<div id="modal" class="modal-backdrop hidden"><div class="modal"><div class="modal-head"><h3>方案版本</h3><button id="closeModal">×</button></div><input id="planSearch" class="modal-search" placeholder="搜索方案名称…"><div id="planList"></div></div></div>
<div id="authModal" class="modal-backdrop hidden"><div class="modal"><div class="modal-head"><h3>需要登录</h3><button id="closeAuthModal">×</button></div><div class="auth-form"><label>用户名<input id="authUsername" type="text" placeholder="输入用户名" value="admin"></label><label>密码<input id="authPassword" type="password" placeholder="输入密码"></label><button id="authLoginBtn" class="btn btn-primary">登录</button></div></div></div>
<div id="cameraModal" class="modal-backdrop hidden"><div class="modal camera-modal"><div class="modal-head"><h3 id="cameraModalTitle">拍照需求</h3><button id="closeCameraBtn" type="button" aria-label="关闭摄像头">×</button></div><div class="camera-body"><video id="cameraPreview" autoplay playsinline muted></video><canvas id="cameraCanvas" class="hidden"></canvas><p class="camera-hint" id="cameraHint">对准白板、需求截图或群聊通知，点击拍摄后自动识别</p></div><div class="camera-actions"><button id="cameraCancelBtn" type="button" class="btn btn-ghost">取消</button><button id="cameraCaptureBtn" type="button" class="btn btn-primary">拍摄</button></div></div></div>
<div id="videoModal" class="modal-backdrop hidden"><div class="modal camera-modal"><div class="modal-head"><h3>录像回答</h3><button id="closeVideoBtn" type="button" aria-label="关闭录像">×</button></div><div class="camera-body"><video id="videoPreview" autoplay playsinline muted></video><div class="video-status" id="videoStatus"><i class="video-rec-dot" aria-hidden="true"></i><span id="videoStatusText">等待开始</span></div><p class="camera-hint" id="videoHint">对准自己，点击"开始录制"后开始回答，最长 3 分钟，可随时提前停止</p></div><div class="camera-actions"><button id="videoCancelBtn" type="button" class="btn btn-ghost">取消</button><button id="videoStartBtn" type="button" class="btn btn-primary">开始录制</button><button id="videoStopBtn" type="button" class="btn btn-primary" disabled>停止并分析</button></div></div></div>
<div id="meetingModal" class="modal-backdrop hidden"><div class="modal camera-modal"><div class="modal-head"><h3>会议旁听</h3><button id="closeMeetingBtn" type="button" aria-label="关闭">×</button></div><div class="meeting-body"><div id="meetingSummary" class="meeting-summary"></div><div id="meetingTasks" class="meeting-tasks"></div><div id="meetingRisks" class="meeting-risks"></div><div id="meetingVisual" class="meeting-visual"></div></div><div class="camera-actions"><button id="meetingCancelBtn" type="button" class="btn btn-ghost">关闭</button><button id="meetingGenerateBtn" type="button" class="btn btn-primary hidden">生成任务草案</button></div></div></div>
<datalist id="participantNames"></datalist>
<script src="/static/app.js?v=4809de87"></script>
<script src="/static/participants.js?v=42eb73fd"></script>
</body>
</html>
