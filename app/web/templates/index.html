项目的有效工作时间，用于时间线折算和负载预警</p><div id="members" class="space-y-2"></div><button type="button" id="addMember" class="inline-flex items-center gap-1 text-xs text-blue-600 hover:text-blue-700 font-medium mt-1"><i data-lucide="plus" class="w-3.5 h-3.5"></i>添加成员</button></div><button type="submit" id="runBtn" class="w-full py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-sm font-semibold rounded-lg hover:from-blue-700 hover:to-indigo-700 active:scale-[0.98] transition-all shadow-sm shadow-blue-600/20 flex items-center justify-center gap-2"><i data-lucide="zap" class="w-4 h-4"></i>生成计划</button></form></div></div>

<script>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab-btn').forEach(b=>{const a=b.dataset.tab===tab;b.className='tab-btn px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition cursor-pointer whitespace-nowrap flex items-center gap-1.5 '+(a?'bg-blue-600 text-white shadow-sm':'text-slate-500 hover:text-slate-700 hover:bg-slate-100');});document.querySelectorAll('.tab-panel').forEach(p=>{p.style.display=p.dataset.panel===tab?'block':'none';});}
{const d=new Date();d.setDate(d.getDate()+14);document.getElementById('deadline').value=d.toISOString().slice(0,10);}
function createMemberRow(n,s,h){n=n||'';s=s||'';h=h||'4';const r=document.createElement('div');r.className='member-row grid grid-cols-12 gap-2 items-center';r.innerHTML='<input type="text" placeholder="\u59d3\u540d" value="'+esc(n)+'" class="member-name col-span-3 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition"><input type="text" placeholder="\u6280\u80fd\u6807\u7b7e" value="'+esc(s)+'" class="member-skills col-span-6 px-2.5 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition"><input type="number" placeholder="\u6bcf\u65e5\u5de5\u65f6" value="'+h+'" class="member-hours col-span-2 px-2 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition" min="0.5" max="12" step="0.5" title="\u8be5\u6210\u5458\u6bcf\u5929\u53ef\u7528\u4e8e\u6b64\u9879\u76ee\u7684\u6709\u6548\u5de5\u4f5c\u65f6\u95f4"><button type="button" class="remove-member col-span-1 w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition" title="\u79fb\u9664"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>';r.querySelector('.remove-member').onclick=function(){r.remove();};return r;}
document.getElementById('members').appendChild(createMemberRow());

function showWarnings(data){var area=document.getElementById('warningsArea');var w=[];if(data.timeline&&data.timeline.total_days>0&&data.input&&data.input.deadline){var dl=new Date(data.input.deadline);var td=new Date();td.setHours(0,0,0,0);var avail=Math.ceil((dl-td)/86400000);if(data.timeline.total_days>avail)w.push({type:'danger',msg:'\u5de5\u671f\u8d85\u51fa\u622a\u6b62\u65e5\u671f\uff01\u603b\u5de5\u671f '+data.timeline.total_days+' \u5929\uff0c\u4f46\u8ddd\u622a\u6b62\u4ec5\u5269 '+avail+' \u5929\u3002\u5efa\u8bae\u51cf\u5c11\u4efb\u52a1\u6216\u589e\u52a0\u4eba\u624b\u3002'});else if(data.timeline.total_days>avail*0.85)w.push({type:'warn',msg:'\u5de5\u671f\u8f83\u7d27\uff1a\u603b\u5de5\u671f '+data.timeline.total_days+' \u5929\uff0c\u8ddd\u622a\u6b62 '+avail+' \u5929\uff0c\u7f13\u51b2\u4e0d\u8db3 15%\u3002'});}
if(data.qa_matrix&&data.qa_matrix.workload&&data.input&&data.input.members){var mm={};data.input.members.forEach(function(m){mm[m.name]=m.available_hours||20;});Object.entries(data.qa_matrix.workload).forEach(function(e){var n=e[0],h=e[1];var c=mm[n];if(c&&h>c)w.push({type:'danger',msg:n+' \u8d1f\u8f7d\u8d85\u6807\uff1aAI \u5206\u914d\u7684\u4efb\u52a1\u6298\u7b97\u5de5\u65f6 '+h.toFixed(1)+'h \u8d85\u8fc7\u4e86\u8be5\u6210\u5458\u586b\u5199\u7684\u603b\u53ef\u7528\u5de5\u65f6 '+c+'h\u3002\u5efa\u8bae\u8c03\u6574\u4efb\u52a1\u6216\u589e\u52a0\u53ef\u7528\u65f6\u95f4\u3002'});else if(c&&h>c*0.85)w.push({type:'warn',msg:n+' \u8d1f\u8f7d\u504f\u9ad8\uff1a\u5206\u914d '+h.toFixed(1)+'h / \u53ef\u7528 '+c+'h ('+(h/c*100).toFixed(0)+'%)\uff0c\u5efa\u8bae\u5173\u6ce8\u3002'});});}

document.getElementById('planForm').addEventListener('submit',async function(e){e.preventDefault();var btn=document.getElementById('runBtn');var area=document.getElementById('resultArea');btn.disabled=true;btn.innerHTML='<span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> \u751f\u6210\u4e2d...';area.innerHTML='<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-16 text-center"><div class="inline-block w-8 h-8 border-3 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div><p class="text-slate-500 text-sm">\u6b63\u5728\u8c03\u7528 AI \u751f\u6210\u8ba1\u5212...</p></div>';document.getElementById('warningsArea').classList.add('hidden');var ns=document.querySelectorAll('.member-name');var ss=document.querySelectorAll('.member-skills');var hs=document.querySelectorAll('.member-hours');var members=[];for(var i=0;i<ns.length;i++){if(ns[i].value.trim())members.push({name:ns[i].value.trim(),skill_tags:ss[i].value.split(',').map(function(s){return s.trim();}).filter(Boolean),daily_available_hours:Math.max(0.5,parseFloat(hs[i].value)||4),available_hours:Math.max(parseFloat(hs[i].value)||4,(parseFloat(hs[i].value)||4)*Math.max(1,Math.ceil((new Date(document.getElementById('deadline').value)-new Date())/86400000)))});}try{var resp=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course:{name:document.getElementById('courseName').value,description:document.getElementById('courseDesc').value},members:members,deadline:document.getElementById('deadline').value,additional_requirements:document.getElementById('extraReq').value})});var data=await resp.json();if(resp.ok){currentData=data;document.getElementById('saveBtn').disabled=false;document.getElementById('exportMdBtn').disabled=false;document.getElementById('exportDocxBtn').disabled=false;document.getElementById('exportPdfBtn').disabled=false;showWarnings(data);renderResult(data);}else{area.innerHTML='<div class="bg-red-50 border border-red-200 rounded-xl p-8 text-center"><p class="text-red-600 text-sm">'+esc(data.detail||'\u672a\u77e5\u9519\u8bef')+'</p></div>';lucide.createIcons();}}catch(err){area.innerHTML='<div class="bg-red-50 border border-red-200 rounded-xl p-8 text-center"><p class="text-red-600 text-sm">'+esc(err.message)+'</p></div>';lucide.createIcons();}finally{btn.disabled=false;btn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> \u751f\u6210\u8ba1\u5212';}});
function renderResult(data){var area=document.getElementById('resultArea');var tnm={};if(data.plan&&data.plan.tasks)data.plan.tasks.forEach(function(x){tnm[x.id]=x.name;});var summaryHtml='';if(data.plan&&data.plan.summary)summaryHtml='<div class="bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200 rounded-xl p-4 mb-4"><div class="flex items-start gap-2"><i data-lucide="lightbulb" class="w-4 h-4 text-amber-500 mt-0.5 shrink-0"></i><p class="text-sm text-amber-800">'+esc(data.plan.summary)+'</p></div></div>';
var tabs=[{id:'plan',label:'\u4efb\u52a1\u8ba1\u5212',icon:'list-checks'},{id:'timeline',label:'\u65f6\u95f4\u7ebf',icon:'calendar-range'},{id:'qa',label:'QA \u77e9\u9635',icon:'users'},{id:'edit',label:'\u7f16\u8f91\u8ba1\u5212',icon:'pencil'},{id:'report',label:'\u62a5\u544a',icon:'file-text'},{id:'interview',label:'\u7b54\u8fa9\u6a21\u62df',icon:'message-circle-question'}];
var tabsHtml='<div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg mb-4 overflow-x-auto">';tabs.forEach(function(t){var a=t.id==='plan'?'bg-blue-600 text-white shadow-sm':'text-slate-500 hover:text-slate-700 hover:bg-white/60';tabsHtml+='<button class="tab-btn px-3 py-1.5 text-xs sm:text-sm font-medium rounded-lg transition cursor-pointer whitespace-nowrap flex items-center gap-1.5 '+a+'" data-tab="'+t.id+'" onclick="switchTab(\''+t.id+'\')"><i data-lucide="'+t.icon+'" class="w-3.5 h-3.5"></i>'+t.label+'</button>';});tabsHtml+='</div>';
var planHtml='<div class="tab-panel" data-panel="plan">';if(data.plan&&data.plan.tasks&&data.plan.tasks.length){var _cp=0,_bp=0,_ip=0,_tot=data.plan.tasks.length;data.plan.tasks.forEach(function(t){if(t.status==='completed')_cp++;else if(t.status==='blocked')_bp++;else if(t.status==='in_progress')_ip++;});var _pct=Math.round(_cp/_tot*100);planHtml+='<div class="mb-4" id="progressBar"><div class="flex items-center justify-between mb-1.5"><span class="text-xs text-slate-500">进度</span><span class="text-xs font-medium text-slate-700">'+_cp+'/'+_tot+' ('+_pct+'%)</span></div><div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div id="progressFill" class="h-full bg-green-500 rounded-full transition-all duration-300" style="width:'+_pct+'%"></div></div>'+(_bp>0?'<div class="mt-1 text-[10px] text-red-500">⚠ '+_bp+' 个阻塞</div>':'')+'</div>';planHtml+='<div class="space-y-2">';data.plan.tasks.forEach(function(t){var deps=(t.dependencies&&t.dependencies.length)?'<span class="text-xs text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md">\u4f9d\u8d56: '+t.dependencies.map(function(d){return esc(d)+' '+esc(tnm[d]||'');}).join(', ')+'</span>':'';var skills=(t.required_skills||[]).map(function(s){return '<span class="text-xs text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">'+esc(s)+'</span>';}).join('');var curStatus=t.status||'pending';var statusOpts='<select class="status-select text-[10px] px-1.5 py-0.5 rounded border border-slate-200 outline-none cursor-pointer ml-1 '+(curStatus==='completed'?'bg-green-100 text-green-700':curStatus==='in_progress'?'bg-blue-100 text-blue-700':curStatus==='blocked'?'bg-red-100 text-red-700':'bg-slate-100 text-slate-500')+'" data-task-id="'+esc(t.id)+'"><option value="pending"'+(curStatus==='pending'?' selected':'')+'>\u5f85\u5f00\u59cb</option><option value="in_progress"'+(curStatus==='in_progress'?' selected':'')+'>\u8fdb\u884c\u4e2d</option><option value="completed"'+(curStatus==='completed'?' selected':'')+'>\u5df2\u5b8c\u6210</option>< function bindInterviewEvents(){var simBtn=document.getElementById('simBtn');if(!simBtn)return;simBtn.addEventListener('click',async function(){if(!currentData)return;simBtn.disabled=true;simBtn.innerHTML='<span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span> \u751f\u6210\u4e2d...';var sr=document.getElementById('simResult');sr.innerHTML='<p class="text-sm text-slate-400">\u6b63\u5728\u751f\u6210\u7b54\u8fa9\u95ee\u9898...</p>';try{var resp=await fetch('/api/interview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:currentData.plan,qa_matrix:currentData.qa_matrix,user_requirements:document.getElementById('simReq').value||''})});var data=await resp.json();if(resp.ok&&data.questions)sr.innerHTML='<div class="bg-violet-50 border border-violet-200 rounded-lg p-4 text-sm text-violet-800 leading-relaxed">'+simpleMarkdown(data.questions)+'</div>';else sr.innerHTML='<p class="text-red-500 text-sm">'+esc(data.detail||'\u751f\u6210\u5931\u8d25')+'</p>';}catch(err){sr.innerHTML='<p class="text-red-500 text-sm">'+esc(err.message)+'</p>';}finally{simBtn.disabled=false;simBtn.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg> AI \u6a21\u62df\u7b54\u8fa9\u63d0\u95ee';}});}
document.getElementById('saveBtn').addEventListener('click',async function(){if(!currentData)return;try{var resp=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentData)});var data=await resp.json();if(resp.ok)alert('\u5df2\u4fdd\u5b58\uff1a'+data.filename);else alert('\u4fdd\u5b58\u5931\u8d25: '+(data.detail||'\u672a\u77e5\u9519\u8bef'));}catch(err){alert('\u4fdd\u5b58\u5931\u8d25: '+err.message);}});
document.getElementById('exportMdBtn').addEventListener('click',function(){if(!currentData)return;fetch('/api/export/markdown',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentData)}).then(function(r){return r.blob();}).then(function(b){var url=URL.createObjectURL(b);var a=document.createElement('a');a.href=url;a.download=(currentData.input.course.name||'plan')+'_report.md';a.click();URL.revokeObjectURL(url);}).catch(function(err){alert('导出失败:'+err.message);});});
document.getElementById('exportDocxBtn').addEventListener('click',function(){if(!currentData)return;fetch('/api/export/docx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentData)}).then(function(r){return r.blob();}).then(function(b){var url=URL.createObjectURL(b);var a=document.createElement('a');a.href=url;a.download=(currentData.input.course.name||'plan')+'_report.docx';a.click();URL.revokeObjectURL(url);}).catch(function(err){alert('导出失败:'+err.message);});});
document.getElementById('exportPdfBtn').addEventListener('click',function(){if(!currentData)return;fetch('/api/export/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(currentData)}).then(function(r){return r.blob();}).then(function(b){var url=URL.createObjectURL(b);var a=document.createElement('a');a.href=url;a.download=(currentData.input.course.name||'plan')+'_report.pdf';a.click();URL.revokeObjectURL(url);}).catch(function(err){alert('导出失败:'+err.message);});});
document.getElementById('loadBtn').addEventListener('click',openPlanList);
async function openPlanList(){try{var resp=await fetch('/api/plans');var data=await resp.json();var plans=data.plans||[];var html='<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="flex items-center justify-between mb-3"><h3 class="text-base font-semibold text-slate-800">\u5386\u53f2\u8ba1\u5212</h3><button class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition" id="modalClose"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><input type="text" id="planSearch" placeholder="\u641c\u7d22\u6587\u4ef6\u540d..." class="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg mb-3 focus:border-blue-500 outline-none"><div class="space-y-2 max-h-72 overflow-y-auto" id="planListContainer">';if(!plans.length)html+='<p class="text-sm text-slate-400 text-center py-6">\u6682\u65e0\u4fdd\u5b58\u7684\u8ba1\u5212</p>';else plans.forEach(function(p){html+='<div class="plan-item flex items-center gap-3 p-3 border border-slate-200 rounded-lg hover:bg-slate-50 transition" data-filename="'+esc(p.filename.toLowerCase())+'"><div class="flex-1 min-w-0"><p class="text-sm font-mono text-slate-600 truncate">'+esc(p.filename)+'</p><p class="text-xs text-slate-400">'+(p.size/1024).toFixed(1)+' KB</p></div><button class="px-3 py-1 text-xs rounded-md border border-slate-300 text-slate-600 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-600 transition" data-load="'+esc(p.filename)+'">\u8f7d\u5165</button><button class="px-3 py-1 text-xs rounded-md border border-red-200 text-red-500 hover:bg-red-50 transition" data-del="'+esc(p.filename)+'">\u5220\u9664</button></div>';});html+='</div></div></div>';var old=document.getElementById('modalBackdrop');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',html);document.getElementById('modalClose').onclick=function(){document.getElementById('modalBackdrop').remove();};document.getElementById('modalBackdrop').onclick=function(e){if(e.target.id==='modalBackdrop')e.target.remove();};document.querySelectorAll('[data-load]').forEach(function(b){b.onclick=function(){loadPlanFile(b.getAttribute('data-load'));};});document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){deletePlanFile(b.getAttribute('data-del'));};});document.getElementById('planSearch').oninput=function(e){var q=e.target.value.toLowerCase();document.querySelectorAll('.plan-item').forEach(function(item){item.style.display=item.getAttribute('data-filename').includes(q)?'flex':'none';});};}catch(err){alert('\u52a0\u8f7d\u5217\u8868\u5931\u8d25: '+err.message);}}
async function loadPlanFile(fn){try{var resp=await fetch('/api/load/'+encodeURIComponent(fn));var data=await resp.json();if(resp.ok){currentData=data;document.getElementById('saveBtn').disabled=false;document.getElementById('exportMdBtn').disabled=false;document.getElementById('exportDocxBtn').disabled=false;document.getElementById('exportPdfBtn').disabled=false;showWarnings(data);renderResult(data);var m=document.getElementById('modalBackdrop');if(m)m.remove();}else alert('\u8f7d\u5165\u5931\u8d25: '+(data.detail||'\u672a\u77e5\u9519\u8bef'));}catch(err){alert('\u8f7d\u5165\u5931\u8d25: '+err.message);}}
async function deletePlanFile(fn){if(!confirm('\u786e\u8ba4\u5220\u9664 '+fn+' ?'))return;try{var resp=await fetch('/api/plans/'+encodeURIComponent(fn),{method:'DELETE'});if(resp.ok)openPlanList();else alert('\u5220\u9664\u5931\u8d25');}catch(err){alert('\u5220\u9664\u5931\u8d25: '+err.message);}}
lucide.createIcons();
</script></body></html>
