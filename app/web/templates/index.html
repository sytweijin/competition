<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智能分工工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-50 text-slate-800">
<header class="bg-white border-b sticky top-0 z-20">
  <div class="max-w-7xl mx-auto px-5 py-4 flex justify-between items-center">
    <div><h1 class="font-bold text-lg">智能分工工作台</h1><p class="text-xs text-slate-400">先确认任务，再确认分工</p></div>
    <div class="flex gap-2"><button id="loadBtn" class="btn">历史方案</button><button id="saveBtn" class="btn" disabled>保存草稿</button></div>
  </div>
</header>
<main class="max-w-7xl mx-auto px-5 py-6">
  <nav id="steps" class="grid grid-cols-6 gap-2 mb-6"></nav>
  <section id="page-info" class="page grid lg:grid-cols-2 gap-6">
    <form id="projectForm" class="panel p-5 space-y-4">
      <h2 class="font-semibold">1. 项目信息</h2>
      <label class="block text-sm">项目名称<input id="projectName" required class="field" placeholder="暑期社会实践总结推送"></label>
      <label class="block text-sm">项目背景<textarea id="background" required class="field" rows="5" placeholder="说明项目目标、执行过程和最终交付物"></textarea></label>
      <label class="block text-sm">任务要求<textarea id="requirements" class="field" rows="3" placeholder="可先填写，上传文件后还可修改"></textarea></label>
      <div class="grid grid-cols-3 gap-3">
        <label class="text-sm">默认开始<input id="start" type="date" class="field"></label>
        <label class="text-sm">默认截止<input id="end" type="date" required class="field"></label>
        <label class="text-sm">每日默认工时<input id="daily" type="number" min=".5" value="4" step=".5" class="field"></label>
      </div>
      <div><div class="flex justify-between"><span class="text-sm">团队成员</span><button type="button" id="addMemberBtn" class="text-blue-600 text-sm">+ 添加</button></div><div id="members" class="space-y-2 mt-2"></div></div>
      <button id="continueAnalysisBtn" type="submit" class="btn-primary">继续：文件分析</button>
    </form>
    <div class="panel p-5">
      <h2 class="font-semibold mb-3">任务要求文件</h2>
      <div id="drop" class="border-2 border-dashed rounded-xl p-10 text-center text-slate-500">
        <input id="files" type="file" multiple class="hidden" accept=".pdf,.docx,.txt,.md,.xlsx,.pptx">
        <button type="button" onclick="files.click()" class="btn">选择文件</button>
        <p class="text-xs mt-3">PDF / Word / TXT / Markdown / Excel / PowerPoint，单文件不超过 15MB</p>
      </div>
      <div id="fileList" class="text-sm mt-3 space-y-1"></div>
    </div>
  </section>
  <section id="page-analysis" class="page hidden panel p-5">
    <div class="flex justify-between"><div><h2 class="font-semibold">2. 文件分析</h2><p class="text-sm text-slate-500">可修改后再用于任务拆解</p></div><button id="reanalyze" class="btn">重新分析</button></div>
    <textarea id="analysis" class="field mt-4" rows="16"></textarea>
    <div class="flex justify-end mt-4"><button id="toDraft" class="btn-primary !w-auto px-8">生成任务拆解草案</button></div>
  </section>
  <section id="page-draft" class="page hidden">
    <div class="panel p-5">
      <div class="flex flex-wrap justify-between gap-3"><div><h2 class="font-semibold">3. 确认任务拆解</h2><p class="text-sm text-slate-500">此时尚未分配任何负责人</p></div>
        <div class="flex gap-2"><button id="addTask" class="btn">新增任务</button><button id="mergeTask" class="btn">合并选中</button><button id="redraft" class="btn">AI 重新拆解</button></div></div>
      <div id="taskEditor" class="space-y-3 mt-4"></div>
      <div id="draftWarnings" class="text-amber-700 text-sm mt-3"></div>
      <div class="flex justify-end mt-4"><button id="confirmDraft" class="btn-primary !w-auto px-8">确认拆解并开始分工</button></div>
    </div>
  </section>
  <section id="page-board" class="page hidden">
    <div class="panel p-5">
      <div class="flex justify-between"><div><h2 class="font-semibold">4–5. 自动分工与手动调整</h2><p class="text-sm text-slate-500">拖动任务卡片即可更换负责人</p></div><button id="restore" class="btn">恢复自动分工</button></div>
      <div id="balanceWarnings" class="mt-3"></div><div id="board" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 mt-4"></div>
      <div class="flex justify-end mt-4"><button id="confirmAssignment" class="btn-primary !w-auto px-8">确认最终分工</button></div>
    </div>
  </section>
  <section id="page-final" class="page hidden panel p-5"><h2 class="font-semibold">6. 最终方案</h2><div id="final" class="mt-4"></div></section>
</main>
<button id="chatOpen" class="fixed right-6 bottom-6 rounded-full bg-indigo-600 text-white w-14 h-14 shadow-lg text-xl">聊</button>
<aside id="chat" class="hidden fixed right-6 bottom-24 w-80 bg-white border rounded-xl shadow-xl z-30 overflow-hidden">
  <div class="p-3 bg-indigo-600 text-white font-medium">项目实时交流</div><div id="messages" class="h-72 overflow-auto p-3 text-sm space-y-2"></div>
  <form id="chatForm" class="p-2 border-t flex gap-2"><input id="chatInput" class="field" placeholder="询问方案或调整建议"><button class="btn">发送</button></form>
</aside>
<script>
var state={input:null,draft:null,plan:null,auto:null,files:[]};
var projectNameEl=document.getElementById('projectName'), backgroundEl=document.getElementById('background'), requirementsEl=document.getElementById('requirements'), startEl=document.getElementById('start'), endEl=document.getElementById('end'), filesEl=document.getElementById('files'), membersEl=document.getElementById('members');
var stepNames=['项目信息','文件分析','任务拆解','自动分工','手动调整','最终方案'];
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function toast(s){var d=document.createElement('div');d.className='fixed top-20 right-6 bg-slate-900 text-white px-4 py-2 rounded-lg z-50';d.textContent=s;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function show(name,step){document.querySelectorAll('.page').forEach(function(x){x.classList.add('hidden')});document.getElementById('page-'+name).classList.remove('hidden');renderSteps(step)}
function renderSteps(active){steps.innerHTML=stepNames.map(function(n,i){return '<div class="rounded-lg px-2 py-2 text-center text-xs '+(i<=active?'bg-indigo-600 text-white':'bg-white border text-slate-400')+'">'+(i+1)+'. '+n+'</div>'}).join('')}
function addMember(v){v=v||{};var d=document.createElement('div');d.className='member grid grid-cols-[1fr_2fr_90px_30px] gap-2';d.innerHTML='<input class="field mname" placeholder="姓名" value="'+esc(v.name||'')+'"><input class="field mskills" placeholder="技能，逗号分隔" value="'+esc((v.skill_tags||[]).join(','))+'"><input class="field mhours" type="number" min=".5" step=".5" value="'+(v.daily_available_hours||4)+'"><button type="button" class="text-red-400">×</button>';d.lastChild.onclick=function(){d.remove()};membersEl.appendChild(d)}
addMember({name:'张三',skill_tags:['文案']});addMember({name:'李四',skill_tags:['摄影']});addMember({name:'王五',skill_tags:['秀米排版']});renderSteps(0);
document.getElementById('addMemberBtn').onclick=function(){addMember()};filesEl.onchange=function(){state.files=Array.from(filesEl.files);fileList.innerHTML=state.files.map(function(f){return '<div>'+esc(f.name)+' · '+(f.size/1024).toFixed(1)+'KB</div>'}).join('')};
function collectInput(){var ms=Array.from(document.querySelectorAll('.member')).map(function(r){var h=+r.querySelector('.mhours').value||4;return {name:r.querySelector('.mname').value.trim(),skill_tags:r.querySelector('.mskills').value.split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean),daily_available_hours:h,available_hours:h*30}}).filter(function(x){return x.name});return {course:{name:projectNameEl.value,description:backgroundEl.value},members:ms,deadline:endEl.value,additional_requirements:requirementsEl.value,background:backgroundEl.value,requirements:requirementsEl.value,default_start_date:startEl.value||null,default_end_date:endEl.value,uploaded_files:state.files.map(function(f){return {name:f.name,size:f.size}}),requirement_analysis:{}}}
projectForm.onsubmit=async function(e){e.preventDefault();var nextBtn=document.getElementById('continueAnalysisBtn');nextBtn.disabled=true;nextBtn.textContent='正在进入文件分析…';try{state.input=collectInput();if(!state.input.members.length)throw Error('请至少填写一名团队成员');show('analysis',1);if(state.files.length){analysis.value='正在上传并解析 '+state.files.length+' 个文件，请稍候…';await analyzeFiles()}else{analysis.value=JSON.stringify({project_goal:backgroundEl.value,summary:requirementsEl.value||backgroundEl.value,questions:['未上传文件，请确认以上项目要求。']},null,2)}}catch(err){show('info',0);toast('无法进入文件分析：'+err.message)}finally{nextBtn.disabled=false;nextBtn.textContent='继续：文件分析'}};
async function analyzeFiles(){var fd=new FormData();state.files.forEach(function(f){fd.append('files',f)});fd.append('background',backgroundEl.value);reanalyze.disabled=true;reanalyze.textContent='分析中…';try{var r=await fetch('/api/analyze-files',{method:'POST',body:fd});var d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));analysis.value=JSON.stringify(d.analysis,null,2);state.input.uploaded_files=d.files;if(d.errors.length)toast('部分文件未能解析')}catch(e){analysis.value='文件分析失败：'+e.message+'\n\n你可以返回项目信息重试，或直接在此处手动填写任务要求。';toast('文件分析失败：'+e.message)}finally{reanalyze.disabled=false;reanalyze.textContent='重新分析'}}
reanalyze.onclick=analyzeFiles;
toDraft.onclick=function(){try{state.input.requirement_analysis=JSON.parse(analysis.value);state.input.requirements=state.input.requirements+'\n'+(state.input.requirement_analysis.summary||'')}catch(e){state.input.requirements=analysis.value}createDraft()};
async function createDraft(){toDraft.disabled=true;toast('正在生成任务草案…');try{var r=await fetch('/api/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:state.input})}),d=await r.json();if(!r.ok)throw Error(d.detail||'生成失败');state.draft=d.plan;renderTasks();show('draft',2)}catch(e){toast(e.message)}finally{toDraft.disabled=false}}
function blankTask(){return {id:'T'+Date.now(),name:'新任务',description:'',category:'其他',estimated_hours:2,required_skills:[],dependencies:[],execution_stage:'实践中',custom_stage:null,start_date:state.input.default_start_date,end_date:state.input.default_end_date,order:state.draft.tasks.length+1,status:'pending',assignee_id:null,collaborator_ids:[]}}
function renderTasks(){taskEditor.innerHTML='';state.draft.tasks.sort(function(a,b){return a.order-b.order}).forEach(function(t,i){var d=document.createElement('div');d.className='task-row border rounded-xl p-3 bg-white';d.draggable=true;d.dataset.id=t.id;d.innerHTML='<div class="flex gap-2 items-center"><input type="checkbox" class="pick"><span class="cursor-move text-slate-300">↕</span><input class="field font-medium tname" value="'+esc(t.name)+'"><button class="btn split">拆分</button><button class="text-red-500 del">删除</button></div><div class="grid md:grid-cols-4 gap-2 mt-2"><input class="field tcat" placeholder="类别" value="'+esc(t.category)+'"><input class="field thours" type="number" min=".5" step=".5" value="'+t.estimated_hours+'"><select class="field tstage">'+['实践前','实践中','实践后','自定义'].map(function(s){return '<option '+(s===t.execution_stage?'selected':'')+'>'+s+'</option>'}).join('')+'</select><input class="field tcustom" placeholder="自定义阶段" value="'+esc(t.custom_stage||'')+'"><input class="field tstart" type="date" value="'+(t.start_date||'')+'"><input class="field tend" type="date" value="'+(t.end_date||'')+'"><input class="field tskills" placeholder="技能，逗号分隔" value="'+esc(t.required_skills.join(','))+'"><input class="field tdeps" placeholder="依赖ID，逗号分隔" value="'+esc(t.dependencies.join(','))+'"></div><textarea class="field mt-2 tdesc" placeholder="任务描述">'+esc(t.description)+'</textarea>';taskEditor.appendChild(d);d.querySelector('.del').onclick=function(){state.draft.tasks=state.draft.tasks.filter(function(x){return x.id!==t.id});renderTasks()};d.querySelector('.split').onclick=function(){syncTasks();var n=blankTask();n.name=t.name+'（子任务2）';n.description=t.description;n.estimated_hours=Math.max(.5,t.estimated_hours/2);t.name=t.name+'（子任务1）';t.estimated_hours=n.estimated_hours;state.draft.tasks.splice(i+1,0,n);renderTasks()};d.ondragstart=function(e){e.dataTransfer.setData('text/plain',t.id)};d.ondragover=function(e){e.preventDefault()};d.ondrop=function(e){e.preventDefault();var from=e.dataTransfer.getData('text/plain'),a=state.draft.tasks.findIndex(function(x){return x.id===from}),b=state.draft.tasks.findIndex(function(x){return x.id===t.id});var x=state.draft.tasks.splice(a,1)[0];state.draft.tasks.splice(b,0,x);state.draft.tasks.forEach(function(x,j){x.order=j+1});renderTasks()}})}
function syncTasks(){Array.from(document.querySelectorAll('.task-row')).forEach(function(r,i){var t=state.draft.tasks.find(function(x){return x.id===r.dataset.id});if(!t)return;t.name=r.querySelector('.tname').value;t.description=r.querySelector('.tdesc').value;t.category=r.querySelector('.tcat').value;t.estimated_hours=+r.querySelector('.thours').value;t.execution_stage=r.querySelector('.tstage').value;t.custom_stage=r.querySelector('.tcustom').value||null;t.start_date=r.querySelector('.tstart').value||null;t.end_date=r.querySelector('.tend').value||null;t.required_skills=r.querySelector('.tskills').value.split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean);t.dependencies=r.querySelector('.tdeps').value.split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean);t.order=i+1})}
addTask.onclick=function(){syncTasks();state.draft.tasks.push(blankTask());renderTasks()};mergeTask.onclick=function(){syncTasks();var ids=Array.from(document.querySelectorAll('.task-row')).filter(function(r){return r.querySelector('.pick').checked}).map(function(r){return r.dataset.id});if(ids.length<2)return toast('请至少选择两项');var picked=state.draft.tasks.filter(function(t){return ids.includes(t.id)}),first=picked[0];first.name=picked.map(function(t){return t.name}).join(' + ');first.description=picked.map(function(t){return t.description}).join('；');first.estimated_hours=picked.reduce(function(s,t){return s+t.estimated_hours},0);first.required_skills=Array.from(new Set(picked.flatMap(function(t){return t.required_skills})));state.draft.tasks=state.draft.tasks.filter(function(t){return !ids.includes(t.id)||t.id===first.id});renderTasks()};redraft.onclick=createDraft;
confirmDraft.onclick=async function(){syncTasks();var bad=state.draft.tasks.find(function(t){return !t.name||t.estimated_hours<=0||(t.start_date&&t.end_date&&t.end_date<t.start_date)});if(bad)return toast('请检查任务名称、工时和日期');confirmDraft.disabled=true;try{var r=await fetch('/api/confirm-draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:state.input,plan:state.draft})}),d=await r.json();if(!r.ok)throw Error(d.detail||'分工失败');state.plan=d;state.auto=JSON.parse(JSON.stringify(d));saveBtn.disabled=false;renderBoard();show('board',4)}catch(e){toast(e.message)}finally{confirmDraft.disabled=false}};
function renderBoard(){var mems=state.plan.input.members.map(function(m){return m.name}),groups={};mems.concat(['未分配']).forEach(function(n){groups[n]=[]});state.plan.plan.tasks.forEach(function(t){groups[t.assignee_id||'未分配'].push(t)});board.innerHTML=Object.keys(groups).map(function(n){var hours=groups[n].reduce(function(s,t){return s+t.estimated_hours},0);return '<div class="board-col border rounded-xl bg-slate-50 p-3 min-h-48" data-owner="'+esc(n)+'"><div class="font-medium">'+esc(n)+' <span class="text-xs text-slate-400">'+groups[n].length+'项 / '+hours.toFixed(1)+'h</span></div><div class="space-y-2 mt-3">'+groups[n].map(function(t){return '<div draggable="true" data-task="'+t.id+'" class="drag-card bg-white border rounded-lg p-3 cursor-move" title="拖拽更换负责人；双击设置协作者"><b class="text-sm">'+esc(t.name)+'</b><div class="text-xs text-slate-500 mt-1">'+t.estimated_hours+'h · '+esc(t.execution_stage)+' · '+esc(t.required_skills.join('/'))+'</div><div class="text-[11px] text-indigo-500 mt-1">协作者：'+esc((t.collaborator_ids||[]).join('、')||'无')+'</div></div>'}).join('')+'</div></div>'}).join('');document.querySelectorAll('.drag-card').forEach(function(c){c.ondragstart=function(e){e.dataTransfer.setData('text/plain',c.dataset.task)};c.ondblclick=function(){var t=state.plan.plan.tasks.find(function(x){return x.id===c.dataset.task}),v=prompt('输入协作者姓名（逗号分隔）：',(t.collaborator_ids||[]).join(','));if(v===null)return;t.collaborator_ids=v.split(/[,，]/).map(function(x){return x.trim()}).filter(function(x){return mems.includes(x)&&x!==t.assignee_id});renderBoard()}});document.querySelectorAll('.board-col').forEach(function(c){c.ondragover=function(e){e.preventDefault()};c.ondrop=function(e){e.preventDefault();var t=state.plan.plan.tasks.find(function(x){return x.id===e.dataTransfer.getData('text/plain')});t.assignee_id=c.dataset.owner==='未分配'?null:c.dataset.owner;t.collaborator_ids=(t.collaborator_ids||[]).filter(function(x){return x!==t.assignee_id});renderBoard()}});renderWarnings()}
function renderWarnings(){var work={},stage={};state.plan.input.members.forEach(function(m){work[m.name]=0;stage[m.name]={}});state.plan.plan.tasks.forEach(function(t){if(t.assignee_id&&work[t.assignee_id]!=null){work[t.assignee_id]+=t.estimated_hours;stage[t.assignee_id][t.execution_stage]=(stage[t.assignee_id][t.execution_stage]||0)+t.estimated_hours}});var vals=Object.values(work),avg=vals.reduce(function(a,b){return a+b},0)/Math.max(1,vals.length),w=[];Object.keys(work).forEach(function(n){if(work[n]===0)w.push(n+'尚未分配任务');if(work[n]>avg*1.35&&work[n]-avg>2)w.push(n+'总工时明显高于团队平均');Object.keys(stage[n]).forEach(function(s){if(stage[n][s]>avg)w.push(n+'在'+s+'阶段任务较集中')})});if(state.plan.plan.tasks.some(function(t){return !t.assignee_id}))w.push('存在未设置负责人的任务');balanceWarnings.innerHTML=w.length?'<div class="bg-amber-50 text-amber-700 rounded-lg p-3 text-sm">'+w.join('；')+'</div>':'<div class="bg-emerald-50 text-emerald-700 rounded-lg p-3 text-sm">当前分工较均衡</div>'}
restore.onclick=function(){state.plan=JSON.parse(JSON.stringify(state.auto));renderBoard()};confirmAssignment.onclick=async function(){var ass={},coll={};state.plan.plan.tasks.forEach(function(t){ass[t.id]=t.assignee_id||'';coll[t.id]=t.collaborator_ids||[]});try{var r=await fetch('/api/manual-assignment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:state.plan,assignees:ass,collaborators:coll})}),d=await r.json();if(!r.ok)throw Error(d.detail);state.plan=d;renderFinal();show('final',5);toast('最终分工已确认')}catch(e){toast(e.message)}};
function renderFinal(){final.innerHTML='<div class="grid md:grid-cols-2 gap-3">'+state.plan.plan.tasks.map(function(t){return '<article class="border rounded-lg p-3"><b>'+esc(t.name)+'</b><p class="text-sm text-slate-500">'+esc(t.assignee_id||'未分配')+' · '+t.estimated_hours+'h · '+esc(t.execution_stage)+'</p><p class="text-xs mt-1">'+esc(t.start_date||'默认日期')+' 至 '+esc(t.end_date||'默认日期')+'</p></article>'}).join('')+'</div>'}
saveBtn.onclick=async function(){if(!state.plan)return;var r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.plan)}),d=await r.json();toast(r.ok?'已保存：'+d.filename:d.detail)};
loadBtn.onclick=async function(){var r=await fetch('/api/plans'),d=await r.json();var f=prompt('输入要载入的文件名：\n'+d.plans.map(function(x){return x.filename}).slice(0,8).join('\n'));if(!f)return;var x=await fetch('/api/load/'+encodeURIComponent(f));state.plan=await x.json();state.input=state.plan.input;state.draft=state.plan.plan;state.auto=JSON.parse(JSON.stringify(state.plan));saveBtn.disabled=false;renderBoard();show('board',4)};
chatOpen.onclick=function(){chat.classList.toggle('hidden')};chatForm.onsubmit=async function(e){e.preventDefault();var m=chatInput.value.trim();if(!m)return;messages.innerHTML+='<div class="text-right"><span class="inline-block bg-indigo-50 p-2 rounded">'+esc(m)+'</span></div>';chatInput.value='';var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,plan:state.plan})}),d=await r.json();messages.innerHTML+='<div><span class="inline-block bg-slate-100 p-2 rounded">'+esc(d.reply||d.detail)+'</span></div>';messages.scrollTop=messages.scrollHeight};
</script>
</body></html>
