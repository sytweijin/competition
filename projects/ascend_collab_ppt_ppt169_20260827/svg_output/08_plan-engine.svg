<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arrowTri4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#375A86"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">02 · 系统架构与核心机制</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">计划引擎：LLM 创造 × 算法正确</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="lead" data-pptx-bounds="40 158 1200 66">
    <text x="40" y="190" font-size="20" fill="#1E293B">计划是拿来执行的，不是拿来欣赏的。因此我们把引擎拆成两半：<tspan x="40" dy="28">AI 负责“想得开”，算法负责“算得准”——各干各擅长的事。</tspan></text>
  </g>
  <g id="pipeline" data-pptx-bounds="40 234 1200 96">
    <rect x="40" y="240" width="216" height="70" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/sparkles" x="58" y="252" width="26" height="26" fill="#375A86" stroke-width="2"/>
    <text x="96" y="278" font-size="16" font-weight="bold" fill="#1E293B">任务拆解</text>
    <line x1="256" y1="275" x2="284" y2="275" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri4)"/>
    <rect x="288" y="240" width="216" height="70" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/shield-check" x="306" y="252" width="26" height="26" fill="#375A86" stroke-width="2"/>
    <text x="344" y="278" font-size="16" font-weight="bold" fill="#1E293B">结构化校验</text>
    <line x1="504" y1="275" x2="532" y2="275" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri4)"/>
    <rect x="536" y="240" width="216" height="70" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/target" x="554" y="252" width="26" height="26" fill="#375A86" stroke-width="2"/>
    <text x="592" y="278" font-size="16" font-weight="bold" fill="#1E293B">技能匹配分工</text>
    <line x1="752" y1="275" x2="780" y2="275" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri4)"/>
    <rect x="784" y="240" width="216" height="70" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/timeline" x="802" y="252" width="26" height="26" fill="#375A86" stroke-width="2"/>
    <text x="840" y="278" font-size="16" font-weight="bold" fill="#1E293B">CPM 关键路径排期</text>
    <line x1="1000" y1="275" x2="1028" y2="275" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri4)"/>
    <rect x="1032" y="240" width="208" height="70" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/file-text" x="1050" y="252" width="26" height="26" fill="#375A86" stroke-width="2"/>
    <text x="1088" y="278" font-size="16" font-weight="bold" fill="#1E293B">报告生成</text>
  </g>
  <g id="split-llm" data-pptx-bounds="40 356 590 250">
    <rect x="40" y="356" width="590" height="250" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="40" y="356" width="590" height="8" fill="#C9A227"/>
    <use data-icon="tabler-outline/sparkles" x="70" y="388" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="120" y="412" font-size="22" font-weight="bold" fill="#1E293B">LLM 负责创造</text>
    <text x="70" y="456" font-size="16" fill="#1E293B">理解自然语言需求、拆解任务、给出工时建议、组织报告表达、<tspan x="70" dy="26">提出批判性审查建议——这些工作没有唯一正确答案，</tspan><tspan x="70" dy="26">适合大模型发挥。</tspan></text>
  </g>
  <g id="split-algo" data-pptx-bounds="650 356 590 250">
    <rect x="650" y="356" width="590" height="250" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="650" y="356" width="590" height="8" fill="#375A86"/>
    <use data-icon="tabler-outline/adjustments" x="680" y="388" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="730" y="412" font-size="22" font-weight="bold" fill="#1E293B">确定性算法负责正确</text>
    <text x="680" y="456" font-size="16" fill="#1E293B">关键路径与浮动、技能评分、负载均衡、依赖校验、跳过周末与不可用日<tspan x="680" dy="26">的日期约束——这些工作必须精确、可复现，</tspan><tspan x="680" dy="26">绝不能依赖模型输出的偶然正确。</tspan></text>
  </g>
  <g id="fallback-bar" data-pptx-bounds="40 630 1200 56">
    <rect x="40" y="630" width="1200" height="56" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/lifebuoy" x="68" y="642" width="28" height="28" fill="#375A86" stroke-width="2"/>
    <text x="110" y="664" font-size="15" fill="#1E293B">兜底：拆解、分工、排期、审查任一环节的 LLM 失败，自动切换到确定性规则实现；演示不依赖模型持续在线。</text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">08 / 29 · v7.1</text>
  </g>
</svg>
