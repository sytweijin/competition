    <text x="972" y="362" font-size="20" font-weight="bold" fill="#1E293B">群通知 / 今日播报</text>
    <text x="972" y="396" font-size="14" fill="#64748B">企业微信、飞书、钉钉 Webhook 自动推送，<tspan x="972" dy="20">云端 TTS 播报今日待办。</tspan></text>
  </g>
  <g id="mechanism-grid" data-pptx-bounds="40 462 1200 180">
    <rect x="40" y="462" width="380" height="180" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/lock" x="66" y="486" width="30" height="30" fill="#375A86" stroke-width="2"/>
    <text x="110" y="508" font-size="20" font-weight="bold" fill="#1E293B">全程免登录</text>
    <text x="66" y="550" font-size="15" fill="#1E293B">token 绑定方案与成员，无需注册，<tspan x="66" dy="23">手机即可完成汇报与确认。</tspan></text>
    <rect x="450" y="462" width="380" height="180" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/bell" x="476" y="486" width="30" height="30" fill="#375A86" stroke-width="2"/>
    <text x="520" y="508" font-size="20" font-weight="bold" fill="#1E293B">自动触达</text>
    <text x="476" y="550" font-size="15" fill="#1E293B">状态变更自动推送 Webhook，<tspan x="476" dy="23">无需人工转发，消息不遗漏。</tspan></text>
    <rect x="860" y="462" width="380" height="180" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/calendar-stats" x="886" y="486" width="30" height="30" fill="#375A86" stroke-width="2"/>
    <text x="930" y="508" font-size="20" font-weight="bold" fill="#1E293B">今日播报</text>
    <text x="886" y="550" font-size="15" fill="#1E293B">云端 TTS 朗读今日待办要点，<tspan x="886" dy="23">团队节奏一目了然。</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">16 / 29 · v7.1</text>
