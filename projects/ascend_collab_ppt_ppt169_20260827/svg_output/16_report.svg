  </g>
  <g id="step-4" data-pptx-bounds="946 238 294 190">
    <rect x="946" y="238" width="294" height="190" rx="4" fill="#F0F6FC"/>
    <text x="972" y="276" font-size="18" font-weight="bold" fill="#C9A227">04</text>
