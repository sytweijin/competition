    <text x="670" y="276" font-size="18" font-weight="bold" fill="#C9A227">03</text>
    <use data-icon="tabler-outline/clipboard-check" x="670" y="292" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="670" y="362" font-size="20" font-weight="bold" fill="#1E293B">负责人确认</text>
    <text x="670" y="396" font-size="14" fill="#64748B">确认完成，变更进入计划，<tspan x="670" dy="20">并自动触发即时重算。</tspan></text>
