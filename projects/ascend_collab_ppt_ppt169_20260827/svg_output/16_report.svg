<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arrowTri7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#375A86"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">03 · 核心功能详解</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">汇报触达：免登录汇报 + 自动群通知</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="lead" data-pptx-bounds="40 156 1200 66">
    <text x="40" y="188" font-size="20" fill="#1E293B">进度追踪的成本越低，成员越愿意更新；通知触达越自动，负责人越不需要追问。<tspan x="40" dy="28">这条链路把“汇报”变成一件顺手的事。</tspan></text>
  </g>
  <g id="step-1" data-pptx-bounds="40 238 272 190">
    <rect x="40" y="238" width="272" height="190" rx="4" fill="#F0F6FC"/>
    <text x="66" y="276" font-size="18" font-weight="bold" fill="#C9A227">01</text>
    <use data-icon="tabler-outline/link" x="66" y="292" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="66" y="362" font-size="20" font-weight="bold" fill="#1E293B">生成链接</text>
    <text x="66" y="396" font-size="14" fill="#64748B">token 绑定方案与成员，免登录，<tspan x="66" dy="20">打开只看到自己的任务。</tspan></text>
  </g>
  <g id="arrow-1" data-pptx-bounds="312 320 30 30">
    <line x1="312" y1="335" x2="338" y2="335" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri7)"/>
  </g>
  <g id="step-2" data-pptx-bounds="342 238 272 190">
    <rect x="342" y="238" width="272" height="190" rx="4" fill="#F0F6FC"/>
    <text x="368" y="276" font-size="18" font-weight="bold" fill="#C9A227">02</text>
    <use data-icon="tabler-outline/headphones" x="368" y="292" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="368" y="362" font-size="20" font-weight="bold" fill="#1E293B">语音 / 照片汇报</text>
    <text x="368" y="396" font-size="14" fill="#64748B">语音上报状态、工时与备注，<tspan x="368" dy="20">交付物拍照即可上传。</tspan></text>
  </g>
  <g id="arrow-2" data-pptx-bounds="614 320 30 30">
    <line x1="614" y1="335" x2="640" y2="335" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri7)"/>
  </g>
  <g id="step-3" data-pptx-bounds="644 238 272 190">
