<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">04 · 创新点</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">创新点一：把多模态模型变成协作流程的入口</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="lead" data-pptx-bounds="40 156 1200 96">
    <text x="40" y="188" font-size="20" fill="#1E293B">先看一个常见的现状：市面上几乎所有多模态应用，都把模型放在聊天框里——你问它问题，它回答你，<tspan x="40" dy="28">然后就没有然后了。图片识别、语音转写、视频理解都是一个个孤立的按钮，</tspan><tspan x="40" dy="28">结果永远不会变成团队下一步要做的事。</tspan></text>
  </g>
  <g id="usage-1" data-pptx-bounds="40 268 590 130">
    <rect x="40" y="268" width="590" height="130" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/camera" x="66" y="292" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="118" y="316" font-size="20" font-weight="bold" fill="#1E293B">拍照立项</text>
    <text x="66" y="356" font-size="15" fill="#1E293B">白板、截图、手绘拍下来直接进入任务拆解；系统理解的不只是文字，<tspan x="66" dy="22">还有图表、流程和界面，并把它们转化成项目需求。</tspan></text>
  </g>
  <g id="usage-2" data-pptx-bounds="650 268 590 130">
    <rect x="650" y="268" width="590" height="130" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/microphone" x="676" y="292" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="728" y="316" font-size="20" font-weight="bold" fill="#1E293B">说话排期</text>
    <text x="676" y="356" font-size="15" fill="#1E293B">录音直接交给模型，听懂后生成任务草案；不需要先转写、再复制、再粘贴，<tspan x="676" dy="22">说完就开始了。</tspan></text>
  </g>
  <g id="usage-3" data-pptx-bounds="40 418 590 130">
    <rect x="40" y="418" width="590" height="130" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/video" x="66" y="442" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="118" y="466" font-size="20" font-weight="bold" fill="#1E293B">会议旁听</text>
    <text x="66" y="506" font-size="15" fill="#1E293B">会议录像边看边听：画面和声音分别理解后合并，<tspan x="66" dy="22">自动整理成要点、任务和风险。</tspan></text>
  </g>
  <g id="usage-4" data-pptx-bounds="650 418 590 130">
    <rect x="650" y="418" width="590" height="130" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/volume" x="676" y="442" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="728" y="466" font-size="20" font-weight="bold" fill="#1E293B">答辩直连</text>
    <text x="676" y="506" font-size="15" fill="#1E293B">评委的语音、视频点评直接对话，答辩录像附逐帧表现观察，<tspan x="676" dy="22">现场就能得到反馈。</tspan></text>
  </g>
  <g id="closing" data-pptx-bounds="40 568 1200 112">
    <rect x="40" y="568" width="1200" height="112" rx="4" fill="#375A86"/>
    <use data-icon="tabler-outline/award" x="70" y="590" width="34" height="34" fill="#FFFFFF" stroke-width="2"/>
    <text x="122" y="614" font-size="17" font-weight="bold" fill="#FFFFFF">为什么这是创新</text>
    <text x="70" y="648" font-size="16" fill="#FFFFFF">这些能力的共同点，是模型每一次输出都落到工作流的下一个动作上——<tspan x="70" dy="26">要么变成任务、要么变成排期、要么变成汇报。多模态能力第一次不是附加功能，</tspan><tspan x="70" dy="26">而是协作这件事的入口。</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">19 / 29 · v7.1</text>
  </g>
</svg>
