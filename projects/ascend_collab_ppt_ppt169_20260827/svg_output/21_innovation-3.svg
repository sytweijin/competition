  <g id="lead" data-pptx-bounds="40 156 1200 96">
    <text x="40" y="188" font-size="20" fill="#1E293B">很多作品是一个漂亮的单点 Demo：识别很准、语音很流畅，但离“能解决一个问题”还差很远；<tspan x="40" dy="28">评审时最怕的，是演示到一半模型不可用。</tspan><tspan x="40" dy="28">所以我们做的不是单点，而是一条闭环，并给每一环都准备了确定性兜底。</tspan></text>
  </g>
