<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arrowTri5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#375A86"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">02 · 系统架构与核心机制</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">全模态接入：统一适配层打通五种交互</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="modality-list" data-pptx-bounds="40 164 400 500">
    <rect x="40" y="164" width="400" height="92" rx="3" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/message" x="62" y="180" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="106" y="202" font-size="18" font-weight="bold" fill="#1E293B">文本</text>
    <text x="62" y="232" font-size="14" fill="#64748B">SSE 流式对话，回复逐字出现；<tspan x="62" dy="20">AI 建议抽屉带着当前方案快照。</tspan></text>
    <line x1="440" y1="206" x2="500" y2="206" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri5)"/>
    <rect x="40" y="264" width="400" height="92" rx="3" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/microphone" x="62" y="278" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="106" y="300" font-size="18" font-weight="bold" fill="#1E293B">语音</text>
    <text x="62" y="332" font-size="14" fill="#64748B">按住麦克风直接说，录音作为音频交给模型，<tspan x="62" dy="20">听懂后回答——不是先转写再粘贴。</tspan></text>
    <line x1="440" y1="304" x2="500" y2="304" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri5)"/>
    <rect x="40" y="364" width="400" height="92" rx="3" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/camera" x="62" y="376" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="106" y="398" font-size="18" font-weight="bold" fill="#1E293B">图片</text>
    <text x="62" y="432" font-size="14" fill="#64748B">拍照、白板、截图、扫描 PDF；不只提取文字，<tspan x="62" dy="20">还能理解图表、流程图和手绘。</tspan></text>
    <line x1="440" y1="402" x2="500" y2="402" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri5)"/>
    <rect x="40" y="464" width="400" height="92" rx="3" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/video" x="62" y="474" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="106" y="496" font-size="18" font-weight="bold" fill="#1E293B">视频</text>
    <text x="62" y="532" font-size="14" fill="#64748B">会议录像边看边听，抽帧看画面、抽音频听内容，<tspan x="62" dy="20">合并成要点与任务。</tspan></text>
    <line x1="440" y1="500" x2="500" y2="500" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri5)"/>
    <rect x="40" y="564" width="400" height="92" rx="3" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/volume" x="62" y="572" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="106" y="594" font-size="18" font-weight="bold" fill="#1E293B">TTS</text>
    <text x="62" y="632" font-size="14" fill="#64748B">语音回复可开关、可重听；每天早晨的今日播报<tspan x="62" dy="20">把待办念给你听。</tspan></text>
  </g>
  <g id="adapter" data-pptx-bounds="540 210 380 200">
    <rect x="540" y="210" width="380" height="200" rx="4" fill="#375A86"/>
    <use data-icon="tabler-outline/stack" x="570" y="238" width="40" height="40" fill="#FFFFFF" stroke-width="2"/>
    <text x="628" y="268" font-size="22" font-weight="bold" fill="#FFFFFF">omni_chat 适配层</text>
    <text x="570" y="310" font-size="16" fill="#FFFFFF">统一接入 MiniCPM-o 4.5，四个语音接口</text>
    <text x="570" y="340" font-size="16" fill="#FFFFFF">行为一致；长音频自动分片处理。</text>
    <text x="570" y="376" font-size="14" fill="#D5E0EE">本地直听 / 云端先转写再理解</text>
  </g>
  <g id="backend-local" data-pptx-bounds="960 190 280 130">
    <rect x="960" y="190" width="280" height="130" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/cpu" x="984" y="212" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="1032" y="236" font-size="18" font-weight="bold" fill="#1E293B">昇腾 A3 本地</text>
    <text x="984" y="272" font-size="14" fill="#64748B">llama-omni 能直接听懂音频，<tspan x="984" dy="20">实听实答。</tspan></text>
    <text x="984" y="296" font-size="14" fill="#64748B">评审期主力 · 统一昇腾环境复现</text>
    <line x1="920" y1="255" x2="960" y2="255" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri5)"/>
  </g>
  <g id="backend-cloud" data-pptx-bounds="960 370 280 130">
    <rect x="960" y="370" width="280" height="130" rx="3" fill="#F0F6FC" stroke="#DCE6F0" stroke-width="1"/>
    <use data-icon="tabler-outline/cloud" x="984" y="392" width="32" height="32" fill="#375A86" stroke-width="2"/>
    <text x="1032" y="416" font-size="18" font-weight="bold" fill="#1E293B">ModelBest 云端</text>
    <text x="984" y="452" font-size="14" fill="#64748B">turn-based 音频先转写再理解，<tspan x="984" dy="20">开发期兜底 · 免费 API。</tspan></text>
    <line x1="920" y1="435" x2="960" y2="435" stroke="#375A86" stroke-width="2" marker-end="url(#arrowTri5)"/>
  </g>
  <g id="measure-note" data-pptx-bounds="540 440 400 120">
    <rect x="540" y="440" width="400" height="120" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/activity" x="566" y="462" width="28" height="28" fill="#375A86" stroke-width="2"/>
    <text x="608" y="484" font-size="16" font-weight="bold" fill="#1E293B">实测记录</text>
    <text x="566" y="516" font-size="14" fill="#1E293B">昇腾 A3 语音理解约 8 秒；<tspan x="566" dy="20">云端音频自动“先转写再理解”。</tspan></text>
    <text x="566" y="540" font-size="14" fill="#64748B">详见 P26 工程验证。</text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">09 / 29 · v7.1</text>
  </g>
