<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">01 · 项目概览</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">项目一览：功能 · 创新 · 应用</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="banner-position" data-pptx-bounds="40 160 1200 108">
    <rect x="40" y="160" width="1200" height="104" fill="#375A86"/>
    <text x="72" y="196" font-size="20" fill="#FFFFFF">你只需要给出三样东西：项目要求、团队成员和截止日期。<tspan x="72" dy="30">系统会把它变成一份可编辑的协作计划——任务拆解、关键路径排期、技能匹配分工、报告生成，</tspan><tspan x="72" dy="30">并且随时可以调整、每次调整都会即时重算。</tspan></text>
  </g>
  <g id="card-feature" data-pptx-bounds="40 292 386 320">
    <rect x="40" y="292" width="386" height="320" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="40" y="292" width="386" height="6" fill="#375A86"/>
    <use data-icon="tabler-outline/clipboard-list" x="66" y="320" width="38" height="38" fill="#375A86" stroke-width="2"/>
    <text x="120" y="348" font-size="22" font-weight="bold" fill="#1E293B">功能</text>
    <text x="66" y="398" font-size="15" fill="#1E293B">五种模态都能输入：打字、说话、拍照、<tspan x="66" dy="24">上传录像、听播报，系统会听、会看、会读，</tspan><tspan x="66" dy="24">把它们变成可执行的任务。</tspan></text>
    <text x="66" y="492" font-size="15" fill="#1E293B">计划引擎负责拆解、排期、分工与报告；<tspan x="66" dy="24">动态协作让你随时改、系统随时重算；</tspan><tspan x="66" dy="24">汇报与通知把进度自动送到每个人面前。</tspan></text>
  </g>
  <g id="card-innovation" data-pptx-bounds="446 292 386 320">
    <rect x="446" y="292" width="386" height="320" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="446" y="292" width="386" height="6" fill="#C9A227"/>
    <use data-icon="tabler-outline/award" x="472" y="320" width="38" height="38" fill="#375A86" stroke-width="2"/>
    <text x="526" y="348" font-size="22" font-weight="bold" fill="#1E293B">创新</text>
    <text x="472" y="398" font-size="15" fill="#1E293B">多模态大模型第一次不再只是聊天框：<tspan x="472" dy="24">拍照、录音、会议录像直接进入任务拆解。</tspan></text>
    <text x="472" y="492" font-size="15" fill="#1E293B">计划正确性交给确定性算法——关键路径、<tspan x="472" dy="24">技能评分、负载均衡、依赖校验全部可复现；</tspan><tspan x="472" dy="24">任何环节失败都有兜底，演示不依赖模型在线。</tspan></text>
  </g>
  <g id="card-application" data-pptx-bounds="852 292 388 320">
    <rect x="852" y="292" width="388" height="320" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="852" y="292" width="388" height="6" fill="#7B9DC4"/>
    <use data-icon="tabler-outline/rocket" x="878" y="320" width="38" height="38" fill="#375A86" stroke-width="2"/>
    <text x="932" y="348" font-size="22" font-weight="bold" fill="#1E293B">应用</text>
    <text x="878" y="398" font-size="15" fill="#1E293B">从课堂到企业：几人的课程小组、社团活动、<tspan x="878" dy="24">中小型企业项目都适用；小型项目扁平推进，</tspan><tspan x="878" dy="24">大型项目分层认领。</tspan></text>
    <text x="878" y="492" font-size="15" fill="#1E293B">通知直接推送到企业微信、飞书、钉钉工作群，<tspan x="878" dy="24">成员用手机就能汇报；昇腾 A3 本地或云端</tspan><tspan x="878" dy="24">双后端均可复现。</tspan></text>
  </g>
  <g id="principle-bar" data-pptx-bounds="40 636 1200 52">
    <rect x="40" y="636" width="1200" height="52" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/lifebuoy" x="68" y="646" width="28" height="28" fill="#375A86" stroke-width="2"/>
    <text x="110" y="668" font-size="15" fill="#1E293B">两条设计原则贯穿始终：LLM 负责创造性拆解，确定性算法负责正确性保证；每个环节失败都有兜底，主链路永不中断。</text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">03 / 29 · v7.1</text>
  </g>
</svg>
