<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">03 · 核心功能详解</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">功能总览：五大能力模块</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="mod-engine" data-pptx-bounds="40 164 590 158">
    <rect x="40" y="164" width="590" height="158" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/adjustments" x="66" y="186" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="116" y="210" font-size="20" font-weight="bold" fill="#1E293B">计划引擎 · 核心</text>
    <text x="66" y="248" font-size="15" fill="#1E293B">把项目要求拆成有依赖关系的子任务，估算工时，按技能匹配出三层角色，<tspan x="66" dy="23">用 CPM 算法排出关键路径并生成风险报告；支持小型与大型两种项目模式。</tspan></text>
  </g>
  <g id="mod-collab" data-pptx-bounds="40 338 590 158">
    <rect x="40" y="338" width="590" height="158" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/refresh" x="66" y="360" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="116" y="384" font-size="20" font-weight="bold" fill="#1E293B">动态协作</text>
    <text x="66" y="422" font-size="15" fill="#1E293B">草案可以增删改、拆分合并；分工可以拖拽；成员变动、状态切换、工时变化都会触发即时重算。<tspan x="66" dy="23">每次保存都生成版本快照，可以对比、可以回滚。</tspan></text>
  </g>
  <g id="mod-multimodal" data-pptx-bounds="40 512 590 158">
    <rect x="40" y="512" width="590" height="158" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/sparkles" x="66" y="534" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="116" y="558" font-size="20" font-weight="bold" fill="#1E293B">全模态交互</text>
    <text x="66" y="596" font-size="15" fill="#1E293B">打字、说话、拍照、传录像、听播报，五种模态都接到真实协作动作上，<tspan x="66" dy="23">由统一适配层接入 MiniCPM-o，每种输入都能变成计划的一部分。</tspan></text>
  </g>
  <g id="mod-report" data-pptx-bounds="650 164 590 158">
    <rect x="650" y="164" width="590" height="158" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/send" x="676" y="186" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="726" y="210" font-size="20" font-weight="bold" fill="#1E293B">汇报与通知</text>
    <text x="676" y="248" font-size="15" fill="#1E293B">成员用 token 链接免登录汇报，语音或照片都能交；负责人确认后，<tspan x="676" dy="23">变更自动推送到企业微信、飞书或钉钉工作群，还有今日播报。</tspan></text>
  </g>
  <g id="mod-eng" data-pptx-bounds="650 338 590 158">
    <rect x="650" y="338" width="590" height="158" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/settings" x="676" y="360" width="34" height="34" fill="#375A86" stroke-width="2"/>
    <text x="726" y="384" font-size="20" font-weight="bold" fill="#1E293B">工程能力</text>
    <text x="676" y="422" font-size="15" fill="#1E293B">方案可导出为 Word、PDF、Excel、CSV、ICS 等格式；知识库问答复用历史经验；<tspan x="676" dy="23">多用户鉴权、操作审计与版本回滚保证安全；监控与演示前预检保证可运行。</tspan></text>
  </g>
  <g id="matrix-note" data-pptx-bounds="650 512 590 158">
    <rect x="650" y="512" width="590" height="158" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <text x="676" y="546" font-size="20" font-weight="bold" fill="#375A86">模块关系</text>
    <text x="676" y="586" font-size="15" fill="#1E293B">计划引擎是核心，动态协作保证计划实时更新；全模态交互是入口，<tspan x="676" dy="23">汇报与通知是闭环出口，工程能力保障可运行、可复现、可审计。</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">12 / 29 · v7.1</text>
  </g>
</svg>
