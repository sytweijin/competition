    <text x="114" y="518" font-size="18" font-weight="bold" fill="#1E293B">设计原则一：创造与正确分离</text>
    <text x="66" y="554" font-size="15" fill="#1E293B">LLM 负责创造性拆解；关键路径、技能评分、<tspan x="66" dy="24">负载均衡、依赖校验全部由确定性算法完成。</tspan></text>
  </g>
  <g id="principle-2" data-pptx-bounds="650 476 590 116">
