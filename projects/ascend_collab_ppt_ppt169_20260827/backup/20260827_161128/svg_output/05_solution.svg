    <text x="64" y="352" font-size="18" font-weight="bold" fill="#1E293B">拍照立项</text>
    <text x="64" y="380" font-size="14" fill="#64748B">白板、截图、手绘拍下来就能读懂，<tspan x="64" dy="20">直接生成项目需求，不用逐字输入。</tspan></text>
  </g>
  <g id="loop-arrow-1" data-pptx-bounds="256 310 30 40">
