    <text x="40" y="190" font-size="20" fill="#1E293B">我们的答案不是做一个更强的聊天机器人，而是把全模态能力接进一条完整的协作流程：<tspan x="40" dy="28">从立项到交付，每一步都有明确的动作和反馈，环环相扣。</tspan></text>
  </g>
  <g id="loop-step-1" data-pptx-bounds="40 240 216 196">
