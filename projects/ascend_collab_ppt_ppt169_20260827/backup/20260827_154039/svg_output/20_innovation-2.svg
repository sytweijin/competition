<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#2F7FCE" letter-spacing="2">04 · 创新点</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">创新点二：确定性正确性保证</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="engine-llm" data-pptx-bounds="40 170 560 330">
    <rect x="40" y="170" width="560" height="330" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="40" y="170" width="560" height="8" fill="#C9A227"/>
    <use data-icon="tabler-outline/sparkles" x="72" y="204" width="38" height="38" fill="#2F7FCE" stroke-width="2"/>
    <text x="128" y="232" font-size="24" font-weight="bold" fill="#1E293B">LLM 负责创造</text>
    <text x="72" y="296" font-size="16" fill="#1E293B">· 任务拆解（LLM + 知识库工时校准）</text>
    <text x="72" y="332" font-size="16" fill="#1E293B">· 工时建议、报告表达</text>
    <text x="72" y="368" font-size="16" fill="#1E293B">· 批判性审查建议（Reflection）</text>
    <text x="72" y="432" font-size="16" fill="#64748B">AI 负责“想得开”：理解需求、生成弹性方案</text>
  </g>
  <g id="engine-algo" data-pptx-bounds="680 170 560 330">
    <rect x="680" y="170" width="560" height="330" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="680" y="170" width="560" height="8" fill="#2F7FCE"/>
    <use data-icon="tabler-outline/adjustments" x="712" y="204" width="38" height="38" fill="#2F7FCE" stroke-width="2"/>
    <text x="768" y="232" font-size="24" font-weight="bold" fill="#1E293B">确定性算法负责正确</text>
    <text x="712" y="296" font-size="16" fill="#1E293B">· CPM 关键路径与浮动计算</text>
    <text x="712" y="332" font-size="16" fill="#1E293B">· 技能匹配评分、负载均衡、依赖校验</text>
    <text x="712" y="368" font-size="16" fill="#1E293B">· 日期约束：跳过周末与成员不可用日</text>
    <text x="712" y="432" font-size="16" fill="#64748B">算法负责“算得准”：结果可复现、不受模型波动影响</text>
  </g>
  <g id="split-badge" data-pptx-bounds="600 290 80 90">
    <rect x="600" y="290" width="80" height="90" rx="40" fill="#2F7FCE"/>
    <text x="640" y="335" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">分工</text>
    <text x="640" y="360" font-size="14" fill="#DCEBFA" text-anchor="middle">明确</text>
  </g>
  <g id="motivation-bar" data-pptx-bounds="40 530 1200 80">
    <rect x="40" y="530" width="1200" height="80" rx="4" fill="#F0F6FC"/>
    <use data-icon="tabler-outline/bulb" x="68" y="548" width="32" height="32" fill="#2F7FCE" stroke-width="2"/>
    <text x="118" y="566" font-size="16" font-weight="bold" fill="#1E293B">为什么这样设计</text>
    <text x="68" y="596" font-size="16" fill="#1E293B">计划结果直接影响团队执行，不能依赖模型输出的偶然正确；AI 负责“想得开”，算法负责“算得准”。</text>
  </g>
  <g id="fallback-line" data-pptx-bounds="40 626 1200 46">
    <use data-icon="tabler-outline/lifebuoy" x="68" y="630" width="28" height="28" fill="#2F7FCE" stroke-width="2"/>
    <text x="110" y="652" font-size="16" fill="#1E293B">兜底：任何 LLM 环节失败 → 确定性规则兜底；演示不依赖模型持续在线。</text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">20 / 29 · v7.1</text>
  </g>
