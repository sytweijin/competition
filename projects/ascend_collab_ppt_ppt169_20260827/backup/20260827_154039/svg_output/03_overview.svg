  </g>
  <g id="banner-position" data-pptx-bounds="40 164 1200 92">
    <rect x="40" y="164" width="1200" height="88" fill="#2F7FCE"/>
    <text x="72" y="200" font-size="20" fill="#FFFFFF">输入「项目要求 + 团队成员 + 截止日」，系统自动完成 任务拆解 → CPM 关键路径排期 → 技能匹配分工 → 报告生成；<tspan x="72" dy="32">并以 MiniCPM-o 4.5 全模态能力驱动完整协作闭环，支持随时调整、即时重算。</tspan></text>
  </g>
