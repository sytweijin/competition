    <text x="68" y="472" font-size="16" fill="#1E293B">· 动态协作：编辑 · 拖拽 · 即时重算</text>
    <text x="68" y="506" font-size="16" fill="#1E293B">· 汇报触达：免登录汇报页 · 群通知 · 今日播报</text>
    <text x="68" y="548" font-size="16" fill="#64748B">五种模态 × 完整协作链路</text>
  </g>
  <g id="card-innovation" data-pptx-bounds="446 282 386 296">
    <rect x="446" y="282" width="386" height="296" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="446" y="282" width="386" height="6" fill="#C9A227"/>
    <use data-icon="tabler-outline/award" x="474" y="316" width="40" height="40" fill="#2F7FCE" stroke-width="2"/>
    <text x="532" y="346" font-size="24" font-weight="bold" fill="#1E293B">创新</text>
    <text x="474" y="404" font-size="16" fill="#1E293B">· 多模态从“聊天”进入真实协作流程</text>
