    <text x="880" y="472" font-size="16" fill="#1E293B">· 企业微信 / 飞书 / 钉钉群通知</text>
    <text x="880" y="506" font-size="16" fill="#1E293B">· 昇腾 A3 本地或云端双后端可复现</text>
