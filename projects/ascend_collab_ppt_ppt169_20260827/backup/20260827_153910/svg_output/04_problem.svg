<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#17457F" letter-spacing="2">01 · 项目概览</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">背景与痛点：为什么需要“活”的协作规划</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#D9E1EC" stroke-width="1"/>
  </g>
  <g id="intro" data-pptx-bounds="40 180 460 440">
    <rect x="40" y="180" width="460" height="440" rx="4" fill="#F2F5FA"/>
    <text x="72" y="236" font-size="24" font-weight="bold" fill="#17457F">问题普遍存在</text>
    <text x="72" y="296" font-size="20" fill="#1E293B">团队项目从立项到交付，<tspan x="72" dy="32">计划、成员与进度始终在变；</tspan><tspan x="72" dy="32">传统规划工具与通用大模型，</tspan><tspan x="72" dy="32">都停留在“生成一份静态结果”。</tspan></text>
    <line x1="72" y1="420" x2="428" y2="420" stroke="#D9E1EC" stroke-width="1"/>
    <use data-icon="tabler-outline/alert-circle" x="72" y="448" width="32" height="32" fill="#C9A227" stroke-width="2"/>
    <text x="118" y="470" font-size="16" fill="#1E293B">结果：计划一变就过时，<tspan x="118" dy="26">团队反复对齐、进度不透明。</tspan></text>
  </g>
  <g id="pain-01" data-pptx-bounds="540 180 340 210">
    <rect x="540" y="180" width="340" height="210" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <text x="572" y="226" font-size="28" font-weight="bold" fill="#17457F">01</text>
    <use data-icon="tabler-outline/file-text" x="796" y="204" width="40" height="40" fill="#5E8FBF" stroke-width="2"/>
    <text x="572" y="284" font-size="20" font-weight="bold" fill="#1E293B">静态计划表</text>
    <text x="572" y="320" font-size="16" fill="#64748B">规划工具只在开始时生成一张静态分工表，<tspan x="572" dy="26">项目一变就过时，没有持续更新的机制。</tspan></text>
  </g>
  <g id="pain-02" data-pptx-bounds="900 180 340 210">
    <rect x="900" y="180" width="340" height="210" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <text x="932" y="226" font-size="28" font-weight="bold" fill="#17457F">02</text>
    <use data-icon="tabler-outline/message-circle" x="1156" y="204" width="40" height="40" fill="#5E8FBF" stroke-width="2"/>
    <text x="932" y="284" font-size="20" font-weight="bold" fill="#1E293B">大模型未进入流程</text>
    <text x="932" y="320" font-size="16" fill="#64748B">多模态大模型常被当作“聊天机器人”<tspan x="932" dy="26">附加功能，没有进入真实协作流程。</tspan></text>
  </g>
  <g id="pain-03" data-pptx-bounds="540 414 340 210">
    <rect x="540" y="414" width="340" height="210" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <text x="572" y="460" font-size="28" font-weight="bold" fill="#17457F">03</text>
    <use data-icon="tabler-outline/list-check" x="796" y="438" width="40" height="40" fill="#5E8FBF" stroke-width="2"/>
    <text x="572" y="518" font-size="20" font-weight="bold" fill="#1E293B">汇报成本高</text>
    <text x="572" y="554" font-size="16" fill="#64748B">成员更新任务状态成本高，<tspan x="572" dy="26">负责人反复追问进度，信息滞后。</tspan></text>
  </g>
  <g id="pain-04" data-pptx-bounds="900 414 340 210">
    <rect x="900" y="414" width="340" height="210" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <text x="932" y="460" font-size="28" font-weight="bold" fill="#17457F">04</text>
    <use data-icon="tabler-outline/video" x="1156" y="438" width="40" height="40" fill="#5E8FBF" stroke-width="2"/>
    <text x="932" y="518" font-size="20" font-weight="bold" fill="#1E293B">会议内容难沉淀</text>
    <text x="932" y="554" font-size="16" fill="#64748B">会议录音、录像、白板照片<tspan x="932" dy="26">需人二次整理才能变成任务。</tspan></text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">04 / 29 · v7.1</text>
  </g>
</svg>
