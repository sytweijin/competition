<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background"/>
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#17457F" letter-spacing="2">03 · 核心功能详解</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">计划引擎：拆解 · 工时 · 匹配 · 均衡</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227"/>
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#D9E1EC" stroke-width="1"/>
  </g>
  <g id="detail-decompose" data-pptx-bounds="40 170 590 230">
    <rect x="40" y="170" width="590" height="230" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <rect x="40" y="170" width="590" height="6" fill="#17457F"/>
    <use data-icon="tabler-outline/clipboard-list" x="68" y="200" width="36" height="36" fill="#17457F" stroke-width="2"/>
    <text x="120" y="226" font-size="22" font-weight="bold" fill="#1E293B">任务拆解</text>
    <text x="68" y="274" font-size="16" fill="#1E293B">小型项目直接拆解分工；大型项目按“大模块 →<tspan x="68" dy="28">骨干认领 → 子任务 → 志愿者招募”分阶段推进。</tspan></text>
    <text x="68" y="334" font-size="16" fill="#1E293B">LLM + 知识库工时校准生成弹性子任务<tspan x="68" dy="28">（按规模 1–8 项）；失败自动切换确定性兜底。</tspan></text>
  </g>
  <g id="detail-hours" data-pptx-bounds="650 170 590 230">
    <rect x="650" y="170" width="590" height="230" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <rect x="650" y="170" width="590" height="6" fill="#17457F"/>
    <use data-icon="tabler-outline/clock" x="678" y="200" width="36" height="36" fill="#17457F" stroke-width="2"/>
    <text x="730" y="226" font-size="22" font-weight="bold" fill="#1E293B">工时估算</text>
    <text x="678" y="274" font-size="16" fill="#1E293B">结构化工时案例库检索 + 用户反馈学习。</text>
    <text x="678" y="330" font-size="16" fill="#1E293B">实际偏差自动沉淀回知识库，估算越用越准。</text>
  </g>
  <g id="detail-match" data-pptx-bounds="40 420 590 230">
    <rect x="40" y="420" width="590" height="230" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <rect x="40" y="420" width="590" height="6" fill="#17457F"/>
    <use data-icon="tabler-outline/target" x="68" y="450" width="36" height="36" fill="#17457F" stroke-width="2"/>
    <text x="120" y="476" font-size="22" font-weight="bold" fill="#1E293B">技能匹配分工</text>
    <text x="68" y="524" font-size="16" fill="#1E293B">中文 / 近义词 / 中英文技能匹配。</text>
    <text x="68" y="580" font-size="16" fill="#1E293B">负责人 + 主要协助 + 辅助协助三层角色，给出匹配度评分。</text>
  </g>
  <g id="detail-balance" data-pptx-bounds="650 420 590 230">
    <rect x="650" y="420" width="590" height="230" rx="4" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
    <rect x="650" y="420" width="590" height="6" fill="#17457F"/>
    <use data-icon="tabler-outline/adjustments" x="678" y="450" width="36" height="36" fill="#17457F" stroke-width="2"/>
    <text x="730" y="476" font-size="22" font-weight="bold" fill="#1E293B">负载均衡</text>
    <text x="678" y="524" font-size="16" fill="#1E293B">基于成员可用工时与阶段负载自动均衡。</text>
    <text x="678" y="580" font-size="16" fill="#1E293B">均衡后重算匹配评分并说明理由。</text>
  </g>
  <g id="footer" data-pptx-bounds="40 676 1200 30">
    <text x="40" y="694" font-size="12" fill="#64748B">协作分工智能体 · 昇腾全模态版</text>
    <text x="1240" y="694" font-size="12" fill="#64748B" text-anchor="end">13 / 29 · v7.1</text>
  </g>
