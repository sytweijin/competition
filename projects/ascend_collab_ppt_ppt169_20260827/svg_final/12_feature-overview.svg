    <text x="116" y="558" font-size="20" font-weight="bold" fill="#1E293B">全模态交互</text>
    <text fill="#1E293B" font-size="15" x="66" y="596">打字、说话、拍照、传录像、听播报，五种模态都接到真实协作动作上，</text><text fill="#1E293B" font-size="15" x="66" y="619">由统一适配层接入 MiniCPM-o，每种输入都能变成计划的一部分。</text></g>
