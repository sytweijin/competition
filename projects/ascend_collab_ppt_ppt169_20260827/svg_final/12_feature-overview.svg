    <text x="116" y="384" font-size="20" font-weight="bold" fill="#1E293B">动态协作</text>
    <text fill="#1E293B" font-size="15" x="66" y="422">草案可以增删改、拆分合并；分工可以拖拽；成员变动、状态切换、工时变化都会触发即时重算。</text><text fill="#1E293B" font-size="15" x="66" y="445">每次保存都生成版本快照，可以对比、可以回滚。</text></g>
