    <text x="116" y="210" font-size="20" font-weight="bold" fill="#1E293B">计划引擎 · 核心</text>
    <text fill="#1E293B" font-size="15" x="66" y="248">把项目要求拆成有依赖关系的子任务，估算工时，按技能匹配出三层角色，</text><text fill="#1E293B" font-size="15" x="66" y="271">用 CPM 算法排出关键路径并生成风险报告；支持小型与大型两种项目模式。</text></g>
