    <text x="726" y="384" font-size="20" font-weight="bold" fill="#1E293B">工程能力</text>
    <text fill="#1E293B" font-size="15" x="676" y="422">方案可导出为 Word、PDF、Excel、CSV、ICS 等格式；知识库问答复用历史经验；</text><text fill="#1E293B" font-size="15" x="676" y="445">多用户鉴权、操作审计与版本回滚保证安全；监控与演示前预检保证可运行。</text></g>
