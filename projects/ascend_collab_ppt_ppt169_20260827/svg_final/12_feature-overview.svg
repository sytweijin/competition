    <text fill="#1E293B" font-size="15" x="676" y="586">计划引擎是核心，动态协作保证计划实时更新；全模态交互是入口，</text><text fill="#1E293B" font-size="15" x="676" y="609">汇报与通知是闭环出口，工程能力保障可运行、可复现、可审计。</text></g>
