    <path d="M6 9a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" />
    <path d="M12 15l3.4 5.89l1.598 -3.233l3.598 .232l-3.4 -5.889" />
    <path d="M6.802 12l-3.4 5.89l3.598 -.233l1.598 3.232l3.4 -5.889" />
  </g>
    <text x="122" y="614" font-size="17" font-weight="bold" fill="#FFFFFF">为什么这是创新</text>
    <text fill="#FFFFFF" font-size="16" x="70" y="648">这些能力的共同点，是模型每一次输出都落到工作流的下一个动作上——</text><text fill="#FFFFFF" font-size="16" x="70" y="674">要么变成任务、要么变成排期、要么变成汇报。多模态能力第一次不是附加功能，</text><text fill="#FFFFFF" font-size="16" x="70" y="700">而是协作这件事的入口。</text></g>
