    <path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5" />
  </g>
    <text x="728" y="466" font-size="20" font-weight="bold" fill="#1E293B">答辩直连</text>
    <text fill="#1E293B" font-size="15" x="676" y="506">评委的语音、视频点评直接对话，答辩录像附逐帧表现观察，</text><text fill="#1E293B" font-size="15" x="676" y="528">现场就能得到反馈。</text></g>
