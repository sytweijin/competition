    <text x="122" y="324" font-size="22" font-weight="bold" fill="#1E293B">昇腾 A3 本地 · 评审期主力</text>
    <text fill="#1E293B" font-size="15" x="70" y="368">Ascend 910C + llama.cpp-omni + MiniCPM-o-4_5-F16（约 16G），</text><text fill="#1E293B" font-size="15" x="70" y="391">用于真实昇腾环境复现；本地能直接听，实听实答。</text><text x="70" y="462" font-size="14" fill="#64748B">ASCEND_OMNI_WS_URL=ws://127.0.0.1:28099/backend</text>
  </g>
