  <g id="lead" data-pptx-bounds="40 156 1200 96">
    <text fill="#1E293B" font-size="20" x="40" y="188">昇腾赛要求统一昇腾环境复现，但 910C 算力紧张，开发期不可能一直占着。</text><text fill="#1E293B" font-size="20" x="40" y="216">我们的做法，是让同一套系统同时支持两种后端，一键切换——</text><text fill="#1E293B" font-size="20" x="40" y="244">评审用本地昇腾证明复现，开发用云端保证进度。</text></g>
  <g id="backend-a3" data-pptx-bounds="40 268 570 230">
