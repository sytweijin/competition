    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1"/>
  </g>
  <g id="compliance-card" data-pptx-bounds="40 170 590 430">
    <rect x="40" y="170" width="590" height="430" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="40" y="170" width="590" height="8" fill="#375A86"/>
    <!-- icon: tabler-outline/shield-check -->
  <g transform="translate(72, 206) scale(1.66667)" fill="none" stroke="#375A86" stroke-width="2">
    <path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" />
    <path d="M15 19l2 2l4 -4" />
  </g>
    <text x="130" y="236" font-size="24" font-weight="bold" fill="#1E293B">合规与安全</text>
    <text x="72" y="306" font-size="18" font-weight="bold" fill="#375A86">01</text>
    <text x="120" y="300" font-size="17" fill="#1E293B">模型合规可控</text>
    <text x="120" y="330" font-size="15" fill="#64748B">合规模式下全链路仅调用 MiniCPM-o 4.5，不创建任何其他模型客户端</text>
    <text x="72" y="386" font-size="18" font-weight="bold" fill="#375A86">02</text>
    <text x="120" y="380" font-size="17" fill="#1E293B">密钥安全</text>
    <text x="120" y="410" font-size="15" fill="#64748B">API Key 仅存 .env，不进入版本库</text>
    <text x="72" y="466" font-size="18" font-weight="bold" fill="#375A86">03</text>
    <text x="120" y="460" font-size="17" fill="#1E293B">操作可审计</text>
    <text x="120" y="490" font-size="15" fill="#64748B">多用户 ACL、会话登录、操作审计与版本回滚</text>
    <text x="72" y="552" font-size="14" fill="#7B9DC4">APP_MODEL_MODE=minicpm · APP_ALLOW_EXTERNAL_MODELS=0</text>
  </g>
  <g id="boundary-card" data-pptx-bounds="650 170 590 430">
    <rect x="650" y="170" width="590" height="430" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1"/>
    <rect x="650" y="170" width="590" height="8" fill="#C9A227"/>
    <!-- icon: tabler-outline/alert-circle -->
  <g transform="translate(682, 206) scale(1.66667)" fill="none" stroke="#C9A227" stroke-width="2">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
    <path d="M12 8v4" />
    <path d="M12 16h.01" />
  </g>
    <text x="740" y="236" font-size="24" font-weight="bold" fill="#1E293B">已知边界（如实说明）</text>
    <text x="682" y="302" font-size="16" fill="#1E293B">· 8B 模型推理能力有限，演示主打感知与流程闭环，不做高难度推理</text>
    <text x="682" y="356" font-size="16" fill="#1E293B">· 910C 本地 TTS 有已知算子问题，语音播报走云端 API</text>
    <text x="682" y="410" font-size="16" fill="#1E293B">· 云端音频表现为转写，已通过适配层统一行为</text>
    <text x="682" y="464" font-size="16" fill="#1E293B">· llama-omni-server 仅支持单活跃会话，演示前需预检暖机</text>
    <text x="682" y="530" font-size="14" fill="#64748B">边界如实标注，确保演示可预期、可复现</text>
  </g>
  <g id="attitude-bar" data-pptx-bounds="40 624 1200 44">
