    <text x="730" y="412" font-size="22" font-weight="bold" fill="#1E293B">确定性算法负责正确</text>
    <text fill="#1E293B" font-size="16" x="680" y="456">关键路径与浮动、技能评分、负载均衡、依赖校验、跳过周末与不可用日</text><text fill="#1E293B" font-size="16" x="680" y="482">的日期约束——这些工作必须精确、可复现，</text><text fill="#1E293B" font-size="16" x="680" y="508">绝不能依赖模型输出的偶然正确。</text></g>
