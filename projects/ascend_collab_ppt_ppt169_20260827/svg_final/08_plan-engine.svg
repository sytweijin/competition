    <text x="120" y="412" font-size="22" font-weight="bold" fill="#1E293B">LLM 负责创造</text>
    <text fill="#1E293B" font-size="16" x="70" y="456">理解自然语言需求、拆解任务、给出工时建议、组织报告表达、</text><text fill="#1E293B" font-size="16" x="70" y="482">提出批判性审查建议——这些工作没有唯一正确答案，</text><text fill="#1E293B" font-size="16" x="70" y="508">适合大模型发挥。</text></g>
