    <text fill="#1E293B" font-size="20" x="40" y="190">计划是拿来执行的，不是拿来欣赏的。因此我们把引擎拆成两半：</text><text fill="#1E293B" font-size="20" x="40" y="218">AI 负责“想得开”，算法负责“算得准”——各干各擅长的事。</text></g>
