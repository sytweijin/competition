  </g>
    <text x="932" y="348" font-size="22" font-weight="bold" fill="#1E293B">应用</text>
    <text fill="#1E293B" font-size="15" x="878" y="398">从课堂到企业：几人的课程小组、社团活动、</text><text fill="#1E293B" font-size="15" x="878" y="422">中小型企业项目都适用；小型项目扁平推进，</text><text fill="#1E293B" font-size="15" x="878" y="446">大型项目分层认领。</text><text fill="#1E293B" font-size="15" x="878" y="492">通知直接推送到企业微信、飞书、钉钉工作群，</text><text fill="#1E293B" font-size="15" x="878" y="516">成员用手机就能汇报；昇腾 A3 本地或云端</text><text fill="#1E293B" font-size="15" x="878" y="540">双后端均可复现。</text></g>
