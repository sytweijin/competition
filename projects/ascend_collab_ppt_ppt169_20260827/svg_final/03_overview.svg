<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#FFFFFF" data-pptx-role="background" />
  <g id="header" data-pptx-bounds="40 40 1200 100">
    <text x="40" y="66" font-size="16" fill="#375A86" letter-spacing="2">01 · 项目概览</text>
    <text x="40" y="106" font-size="36" font-weight="bold" fill="#1E293B">项目一览：功能 · 创新 · 应用</text>
    <rect x="40" y="120" width="48" height="4" fill="#C9A227" />
    <line x1="40" y1="142" x2="1240" y2="142" stroke="#DCE6F0" stroke-width="1" />
  </g>
  <g id="banner-position" data-pptx-bounds="40 160 1200 108">
    <rect x="40" y="160" width="1200" height="104" fill="#375A86" />
    <text fill="#FFFFFF" font-size="20" x="72" y="196">你只需要给出三样东西：项目要求、团队成员和截止日期。</text><text fill="#FFFFFF" font-size="20" x="72" y="226">系统会把它变成一份可编辑的协作计划——任务拆解、关键路径排期、技能匹配分工、报告生成，</text><text fill="#FFFFFF" font-size="20" x="72" y="256">并且随时可以调整、每次调整都会即时重算。</text></g>
  <g id="card-feature" data-pptx-bounds="40 292 386 320">
    <rect x="40" y="292" width="386" height="320" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1" />
    <rect x="40" y="292" width="386" height="6" fill="#375A86" />
    
  <g transform="translate(66, 320) scale(1.58333)" fill="none" stroke="#375A86" stroke-width="2">
    <path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" />
    <path d="M9 5a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2" />
    <path d="M9 12l.01 0" />
    <path d="M13 12l2 0" />
    <path d="M9 16l.01 0" />
    <path d="M13 16l2 0" />
  </g>
    <text x="120" y="348" font-size="22" font-weight="bold" fill="#1E293B">功能</text>
    <text fill="#1E293B" font-size="15" x="66" y="398">五种模态都能输入：打字、说话、拍照、</text><text fill="#1E293B" font-size="15" x="66" y="422">上传录像、听播报，系统会听、会看、会读，</text><text fill="#1E293B" font-size="15" x="66" y="446">把它们变成可执行的任务。</text><text fill="#1E293B" font-size="15" x="66" y="492">计划引擎负责拆解、排期、分工与报告；</text><text fill="#1E293B" font-size="15" x="66" y="516">动态协作让你随时改、系统随时重算；</text><text fill="#1E293B" font-size="15" x="66" y="540">汇报与通知把进度自动送到每个人面前。</text></g>
  <g id="card-innovation" data-pptx-bounds="446 292 386 320">
    <rect x="446" y="292" width="386" height="320" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1" />
    <rect x="446" y="292" width="386" height="6" fill="#C9A227" />
    
  <g transform="translate(472, 320) scale(1.58333)" fill="none" stroke="#375A86" stroke-width="2">
    <path d="M6 9a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" />
    <path d="M12 15l3.4 5.89l1.598 -3.233l3.598 .232l-3.4 -5.889" />
    <path d="M6.802 12l-3.4 5.89l3.598 -.233l1.598 3.232l3.4 -5.889" />
  </g>
    <text x="526" y="348" font-size="22" font-weight="bold" fill="#1E293B">创新</text>
    <text fill="#1E293B" font-size="15" x="472" y="398">多模态大模型第一次不再只是聊天框：</text><text fill="#1E293B" font-size="15" x="472" y="422">拍照、录音、会议录像直接进入任务拆解。</text><text fill="#1E293B" font-size="15" x="472" y="492">计划正确性交给确定性算法——关键路径、</text><text fill="#1E293B" font-size="15" x="472" y="516">技能评分、负载均衡、依赖校验全部可复现；</text><text fill="#1E293B" font-size="15" x="472" y="540">任何环节失败都有兜底，演示不依赖模型在线。</text></g>
  <g id="card-application" data-pptx-bounds="852 292 388 320">
    <rect x="852" y="292" width="388" height="320" rx="4" fill="#FFFFFF" stroke="#DCE6F0" stroke-width="1" />
    <rect x="852" y="292" width="388" height="6" fill="#7B9DC4" />
    
  <g transform="translate(878, 320) scale(1.58333)" fill="none" stroke="#375A86" stroke-width="2">
